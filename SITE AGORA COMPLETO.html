<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>ILLIT Archive</title>
<style>
:root{--bg:#f2f2f7;--text:#17171a;--muted:#85858e;--pink:#ff5fa2;--line:rgba(0,0,0,.08);--yunah:#ff5a67;--minju:#ffd84d;--moka:#b99bea;--wonhee:#ff9bc5;--iroha:#8ddcf5;--shadow:0 10px 30px rgba(0,0,0,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:var(--bg);color:var(--text)}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}button:active{transform:scale(.97)}#app{width:100%;max-width:430px;min-height:100vh;margin:auto;padding-bottom:90px}.header{height:76px;padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(242,242,247,.85);backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:14px;object-fit:cover;background:#fff;display:grid;place-items:center;box-shadow:0 5px 18px rgba(0,0,0,.08)}.brand h1{font-size:17px;margin:0;font-weight:800}.brand p{font-size:10px;color:var(--muted);margin:3px 0 0}.icon-btn{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.07)}main{padding:6px 16px 20px}.page{display:none;animation:in .22s ease}.page.active{display:block}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.heading{margin:12px 3px 18px}.heading h2{font-size:31px;letter-spacing:-1.2px;margin:0}.heading p{margin:5px 0;color:var(--muted);font-size:12px}.card{background:rgba(255,255,255,.88);border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow)}
.hero{padding:24px;position:relative;overflow:hidden}.hero:after{content:"✦  ✧  ⋆";position:absolute;right:16px;top:17px;color:#ddd;font-size:17px}.eyebrow{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#999;font-weight:800}.hero h2{font-size:30px;margin:8px 0 2px}.hero .tag{font-size:15px;color:#555}.hero p{font-size:12px;line-height:1.55;color:#777;margin:17px 0 0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}.quick button{text-align:left;padding:17px;border-radius:20px;background:#fff;min-height:105px;box-shadow:0 6px 22px rgba(0,0,0,.05)}.quick i{font-style:normal;font-size:20px}.quick b{display:block;font-size:13px;margin-top:12px}.quick span{font-size:10px;color:#999}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#999;font-weight:800;margin:24px 3px 10px}.members-strip{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}.members-strip::-webkit-scrollbar{display:none}.mini{min-width:78px;background:#fff;border-radius:18px;padding:11px 7px;text-align:center;box-shadow:0 5px 18px rgba(0,0,0,.04)}.mini-avatar{width:45px;height:45px;margin:auto;border-radius:15px;background:#f4f4f6;display:grid;place-items:center;font-size:20px}.mini b{font-size:10px;display:block;margin-top:7px}.note{text-align:center;background:rgba(255,255,255,.65);border-radius:17px;padding:12px;margin-top:11px;color:#888;font-size:11px}
.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.member-card{height:325px;perspective:1000px;cursor:pointer}.inner{width:100%;height:100%;position:relative;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.member-card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}.front{display:flex;flex-direction:column}.photo,.photo-placeholder{height:210px;width:100%;object-fit:cover;background:linear-gradient(145deg,#fff,#e7e7ec)}.photo-placeholder{display:grid;place-items:center;font-size:36px;color:#aaa}.front-info{padding:12px 14px}.star{font-size:14px;margin-bottom:4px}.front-name{font-size:16px;font-weight:850}.hint{font-size:9px;color:#aaa;margin-top:5px}.back{transform:rotateY(180deg);padding:15px}.back h3{font-size:17px;margin:0 0 9px}.facts{display:grid;gap:6px;max-height:226px;overflow:auto}.fact{font-size:9.5px;line-height:1.25}.fact b{display:block;font-size:8px;text-transform:uppercase;color:#aaa;letter-spacing:.5px}.black-btn,.light-btn,.danger-btn{padding:10px 12px;border-radius:13px;font-size:11px;font-weight:750}.black-btn{background:#111;color:#fff}.light-btn{background:#f0f0f3;color:#222}.danger-btn{background:#fff0f0;color:#c33}.edit-member{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);padding:6px 8px;border-radius:10px;font-size:10px;z-index:2}
.profile-hero{padding:10px;background:#fff;border-radius:25px;box-shadow:var(--shadow)}.profile-hero img,.profile-placeholder{height:350px;width:100%;object-fit:cover;border-radius:19px}.profile-placeholder{display:grid;place-items:center;background:linear-gradient(145deg,#fff,#e6e6eb);font-size:55px;color:#aaa}.profile-name{padding:13px 4px 2px}.profile-name h3{font-size:27px;margin:0}.profile-name p{font-size:12px;color:#888;margin:5px 0}.full-facts{display:grid;gap:8px;margin-top:12px}.full-fact{background:#fff;padding:12px 14px;border-radius:16px}.full-fact span{font-size:8px;color:#aaa;text-transform:uppercase;letter-spacing:.6px}.full-fact b{display:block;font-size:12px;margin-top:3px}.back-page{background:#fff;border-radius:13px;padding:9px 12px;font-size:11px;font-weight:750;margin-bottom:12px}
.tabs,.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 7px;scrollbar-width:none}.tabs::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}.tab,.filter{white-space:nowrap;background:#fff;border-radius:13px;padding:9px 12px;font-size:10px;font-weight:750;color:#777}.tab.active{background:#111;color:#fff}.tab.yunah.active{background:var(--yunah)}.tab.minju.active{background:#e4c01b;color:#111}.tab.moka.active{background:var(--moka)}.tab.wonhee.active{background:var(--wonhee);color:#111}.tab.iroha.active{background:var(--iroha);color:#111}.calendar{padding:14px;background:#fff;border-radius:24px;box-shadow:var(--shadow);margin-top:5px}.calendar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.month{font-size:18px;font-weight:850}.month-btns{display:flex;gap:5px}.month-btns button{width:33px;height:33px;border-radius:10px;background:#f0f0f3}.day{padding:11px 0;border-top:1px solid var(--line)}.day:first-child{border-top:0}.dayhead{display:flex;justify-content:space-between}.dayhead b{font-size:11px}.dayhead span{font-size:9px;color:#aaa}.event{display:flex;gap:8px;background:#f7f7f9;border-radius:14px;padding:10px;margin-top:7px}.event-star{font-size:13px}.event-main{flex:1;min-width:0}.event-title{font-size:11px;font-weight:800}.event-meta,.event-desc{font-size:9px;color:#888;margin-top:3px}.event-desc{line-height:1.4}.event-actions{display:flex;gap:4px}.tiny{background:#fff;border-radius:8px;padding:5px;font-size:9px}.empty{padding:27px;text-align:center;color:#999;font-size:11px}
.activity-tools{display:flex;justify-content:space-between;align-items:center;margin:8px 1px}.count{font-size:10px;color:#888}.add-btn{background:#111;color:#fff;border-radius:12px;padding:9px 11px;font-size:10px;font-weight:750}.filter.active{background:#e8e8ec;color:#111}.activity-list{display:grid;gap:9px}.activity{background:#fff;border-radius:18px;padding:13px;box-shadow:0 5px 20px rgba(0,0,0,.045)}.activity-top{display:flex;gap:9px}.activity-icon{width:34px;height:34px;border-radius:11px;background:#f1f1f4;display:grid;place-items:center}.activity-body{flex:1;min-width:0}.activity-title{font-size:12px;font-weight:800}.activity-date{font-size:9px;color:#999;margin-top:3px}.activity-desc{font-size:10px;color:#777;line-height:1.4;margin-top:7px}.activity-member{font-size:8px;font-weight:800;margin-top:6px}.activity-link{font-size:9px;color:#555;text-decoration:underline;display:inline-block;margin-top:6px}.activity-actions{display:flex;gap:5px;margin-top:9px}.activity-actions button{background:#f1f1f4;padding:6px 8px;border-radius:9px;font-size:9px}
.status-card{background:#fff;padding:16px;border-radius:24px;box-shadow:var(--shadow)}.status-intro{font-size:11px;color:#777;line-height:1.5;margin:0 0 12px}.chart-scroll{overflow-x:auto}.chart{min-width:680px;height:315px;position:relative;padding-left:38px}.grid{position:absolute;left:38px;right:8px;top:12px;bottom:35px;display:flex;flex-direction:column;justify-content:space-between}.grid div{border-top:1px dashed #ddd}.ylab{position:absolute;left:0;top:5px;bottom:29px;display:flex;flex-direction:column;justify-content:space-between;font-size:8px;color:#aaa}.svg{position:absolute;left:38px;right:8px;top:12px;bottom:35px;width:calc(100% - 46px);height:268px;overflow:visible}.xlab{position:absolute;left:38px;right:8px;bottom:8px;display:flex;justify-content:space-between;font-size:8px;color:#999}.legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}.legend span{font-size:9px;font-weight:700;display:flex;align-items:center;gap:4px}.dot{width:7px;height:7px;border-radius:50%}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.total{background:#f7f7f9;padding:9px;border-radius:14px}.total b{font-size:16px;display:block}.total span{font-size:7px;text-transform:uppercase;color:#999}
.settings{display:grid;gap:10px}.setting-card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 5px 20px rgba(0,0,0,.05)}.setting-title{font-size:13px;font-weight:800}.setting-desc{font-size:10px;color:#888;line-height:1.45;margin:4px 0 11px}.logo-preview{width:68px;height:68px;border-radius:18px;background:#f2f2f5;display:grid;place-items:center;overflow:hidden;margin-bottom:10px}.logo-preview img{width:100%;height:100%;object-fit:cover}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:76px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(255,255,255,.83);backdrop-filter:blur(22px);border-top:1px solid rgba(0,0,0,.06);z-index:50}.nav-btn{background:transparent;border-radius:16px;color:#999;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav-btn span{font-size:18px}.nav-btn.active{color:#111;background:#f0f0f3;font-weight:800}.floating{position:fixed;right:max(18px,calc((100vw - 430px)/2 + 18px));bottom:88px;width:49px;height:49px;border-radius:50%;background:#111;color:#fff;font-size:24px;box-shadow:0 10px 25px rgba(0,0,0,.18);z-index:40}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal-bg.show{display:flex}.modal{width:min(430px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:27px 27px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}.modal h3{margin:0 0 15px;font-size:19px}.close{float:right;background:#f0f0f3;border-radius:50%;width:31px;height:31px}.form{display:grid;gap:10px}.form label{font-size:9px;color:#888;font-weight:750;text-transform:uppercase;letter-spacing:.4px}.form input,.form select,.form textarea{width:100%;border:1px solid #e3e3e7;background:#f7f7f9;border-radius:13px;padding:11px;font-size:12px;outline:none}.form textarea{min-height:80px;resize:vertical}.form-actions{display:flex;gap:7px;margin-top:4px}.form-actions>*{flex:1}@keyframes up{from{transform:translateY(100%)}to{transform:none}}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(15px);background:#111;color:#fff;padding:10px 14px;border-radius:14px;font-size:11px;opacity:0;pointer-events:none;z-index:200;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:360px){.member-grid{grid-template-columns:1fr}.member-card{height:350px}.photo,.photo-placeholder{height:235px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header class="header" id="header"></header>
<main>
<section class="page active" id="page-home"></section>
<section class="page" id="page-profile"></section>
<section class="page" id="page-calendar"></section>
<section class="page" id="page-activities"></section>
<section class="page" id="page-status"></section>
<section class="page" id="page-settings"></section>
<section class="page" id="page-member"></section>
</main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<button class="floating" id="floating" onclick="floatingAdd()">+</button>
<div class="modal-bg" id="modal-bg" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const MEMBERS=[
{id:"yunah",name:"YUNAH",color:"#ff5a67",animal:"🐆",data:{birthName:"Roh Yunah",stageName:"YUNAH",koreanName:"노윤아",japaneseName:"",chineseName:"",nationality:"South Korean",birthplace:"",height:"",zodiacSign:"Capricorn",representativeAnimal:"🐆",summerMoonCharacter:"",occupation:"Singer"}},
{id:"minju",name:"MINJU",color:"#ffd84d",animal:"🐰",data:{birthName:"Park Minju",stageName:"MINJU",koreanName:"박민주",japaneseName:"",chineseName:"",nationality:"South Korean",birthplace:"",height:"",zodiacSign:"Taurus",representativeAnimal:"🐰",summerMoonCharacter:"",occupation:"Singer"}},
{id:"moka",name:"MOKA",color:"#b99bea",animal:"☕️",data:{birthName:"Sakurai Moka",stageName:"MOKA",koreanName:"モカ",japaneseName:"さくらい もか",chineseName:"",nationality:"Japanese",birthplace:"",height:"",zodiacSign:"Libra",representativeAnimal:"☕️",summerMoonCharacter:"",occupation:"Singer"}},
{id:"wonhee",name:"WONHEE",color:"#ff9bc5",animal:"🐿️",data:{birthName:"Wonhee",stageName:"WONHEE",koreanName:"원희",japaneseName:"",chineseName:"",nationality:"South Korean",birthplace:"",height:"",zodiacSign:"Cancer",representativeAnimal:"🐿️",summerMoonCharacter:"",occupation:"Singer"}},
{id:"iroha",name:"IROHA",color:"#8ddcf5",animal:"🐢",data:{birthName:"Hokazono Iroha",stageName:"IROHA",koreanName:"이로하",japaneseName:"外園いろは",chineseName:"",nationality:"Japanese",birthplace:"",height:"",zodiacSign:"Aquarius",representativeAnimal:"🐢",summerMoonCharacter:"",occupation:"Singer"}}
];
const KEYS={members:"illit_archive_members",calendar:"illit_archive_calendar",activities:"illit_archive_activities",logo:"illit_archive_logo"};
const TYPES={folder:"📁",link:"🔗",photo:"📷",magazine:"📖",mc:"🎤",video:"🎬",photoshoot:"📸",interview:"🎙️",other:"✦"};
const TYPE_LABEL={folder:"Folder",link:"Link",photo:"Photo",magazine:"Magazine",mc:"MC",video:"Video",photoshoot:"Photoshoot",interview:"Interview",other:"Other"};
let calendarTab="illit", activityTab="illit", activityFilter="all", calDate=new Date(), editingId=null, editingActivityId=null, editingMemberId=null, editingPhoto="";

function load(k,f=[]){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove("show"),1900)}
function openModal(content){document.getElementById("modal").innerHTML=content;document.getElementById("modal-bg").classList.add("show")}
function closeModal(){document.getElementById("modal-bg").classList.remove("show")}
function backdropClose(e){if(e.target.id==="modal-bg")closeModal()}
function members(){let a=load(KEYS.members,null);if(!a){a=MEMBERS.map(x=>({...x,data:{...x.data}}));save(KEYS.members,a)}return a}
function getMember(id){return members().find(x=>x.id===id)||MEMBERS.find(x=>x.id===id)}
function memberColor(id){return getMember(id)?.color||"#111"}
function memberName(id){return id==="illit"?"ILLIT":getMember(id)?.name||id.toUpperCase()}
function memberLabelClass(id){return id==="illit"?"":`member-${id}`}

function header(){
 const logo=localStorage.getItem(KEYS.logo);
 document.getElementById("header").innerHTML=`<div class="brand"><div class="logo">${logo?`<img src="${logo}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`:"✦"}</div><div><h1>ILLIT Archive</h1><p>all five members</p></div></div><button class="icon-btn" onclick="showPage('settings')">⚙️</button>`;
}
function nav(){
 const items=[["home","⌂","Home"],["profile","♡","Profile"],["calendar","☆","Calendar"],["activities","✦","Activities"],["status","◌","Status"]];
 document.getElementById("bottom-nav").innerHTML=items.map(x=>`<button class="nav-btn" id="nav-${x[0]}" onclick="showPage('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("");
}
function showPage(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 const p=document.getElementById("page-"+id);if(!p)return;
 p.classList.add("active");
 document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
 const n=document.getElementById("nav-"+id);if(n)n.classList.add("active");
 document.getElementById("floating").style.display=["calendar","activities"].includes(id)?"block":"none";
 if(id==="home")renderHome();if(id==="profile")renderProfile();if(id==="calendar")renderCalendar();if(id==="activities")renderActivities();if(id==="status")renderStatus();if(id==="settings")renderSettings();
 window.scrollTo({top:0,behavior:"smooth"});
}
function floatingAdd(){if(calendarTab){const active=document.querySelector(".page.active")?.id;if(active==="page-calendar")openCalendarEditor();else if(active==="page-activities")openActivityEditor();}}

function renderHome(){
 document.getElementById("page-home").innerHTML=`<div class="heading"><h2>Home</h2><p>your ILLIT archive</p></div>
 <div class="card hero"><div class="eyebrow">ILLIT Archive</div><h2>this is our world</h2><div class="tag">all five members, one archive.</div><p>an archive dedicated to ILLIT and all five members.</p></div>
 <div class="section-label">Quick Access</div><div class="quick">
 <button onclick="showPage('profile')"><i>♡</i><b>Profile</b><span>five members</span></button>
 <button onclick="showPage('calendar')"><i>☆</i><b>Calendar</b><span>group & solo schedules</span></button>
 <button onclick="showPage('activities')"><i>✦</i><b>Activities</b><span>archive activities</span></button>
 <button onclick="showPage('status')"><i>◌</i><b>Status</b><span>activity evolution</span></button></div>
 <div class="section-label">Members</div><div class="members-strip">${members().map(m=>`<button class="mini" onclick="openMember(${JSON.stringify(m.id)})"><div class="mini-avatar">${m.animal}</div><b style="color:${m.color}">${m.name}</b></button>`).join("")}</div>
 <div class="note">✦ five members, one archive ✦</div>`;
}
function fact(label,value){return `<div class="fact"><b>${label}</b>${esc(value||"—")}</div>`}
function renderProfile(){
 document.getElementById("page-profile").innerHTML=`<div class="heading"><h2>Profile</h2><p>five individual member photocards</p></div><div class="member-grid">${members().map(m=>`
 <div class="member-card" id="card-${m.id}" onclick="flipCard('${m.id}')"><div class="inner">
 <div class="face front">${m.data.photo?`<img class="photo" src="${m.data.photo}">`:`<div class="photo-placeholder">${m.animal}</div>`}<button class="edit-member" onclick="event.stopPropagation();openMemberEditor('${m.id}')">edit</button><div class="front-info"><div class="star" style="color:${m.color}">★</div><div class="front-name" style="color:${m.color}">${m.name}</div><div class="hint">tap to flip</div></div></div>
 <div class="face back"><h3 style="color:${m.color}">${m.name}</h3><div class="facts">${fact("Birth Name",m.data.birthName)}${fact("Stage Name",m.data.stageName)}${fact("Korean Name",m.data.koreanName)}${fact("Japanese Name",m.data.japaneseName)}${fact("Chinese Name",m.data.chineseName)}${fact("Nationality",m.data.nationality)}${fact("Birthplace",m.data.birthplace)}${fact("Height",m.data.height)}${fact("Zodiac Sign",m.data.zodiacSign)}${fact("Representative Animal",m.data.representativeAnimal)}${fact("Summer Moon Character",m.data.summerMoonCharacter)}${fact("Occupation",m.data.occupation)}</div><button class="black-btn" style="width:100%;margin-top:8px" onclick="event.stopPropagation();openMember('${m.id}')">Open Full Profile</button></div>
 </div></div>`).join("")}</div>`;
}
function flipCard(id){document.getElementById("card-"+id)?.classList.toggle("flipped")}
function openMember(id){const m=getMember(id);document.getElementById("page-member").innerHTML=`<div class="full-profile"><button class="back-page" onclick="showPage('profile')">← Back to Profile</button><div class="profile-hero">${m.data.photo?`<img src="${m.data.photo}">`:`<div class="profile-placeholder">${m.animal}</div>`}<div class="profile-name"><h3 style="color:${m.color}">${m.name}</h3><p>${m.data.stageName||m.name}</p></div></div><div class="full-facts">${factFull("Birth Name",m.data.birthName)}${factFull("Stage Name",m.data.stageName)}${factFull("Korean Name",m.data.koreanName)}${factFull("Japanese Name",m.data.japaneseName)}${factFull("Chinese Name",m.data.chineseName)}${factFull("Nationality",m.data.nationality)}${factFull("Birthplace",m.data.birthplace)}${factFull("Height",m.data.height)}${factFull("Zodiac Sign",m.data.zodiacSign)}${factFull("Representative Animal",m.data.representativeAnimal)}${factFull("Summer Moon Character",m.data.summerMoonCharacter)}${factFull("Occupation",m.data.occupation)}</div><button class="black-btn" style="width:100%;margin-top:12px" onclick="openMemberEditor('${m.id}')">Edit Profile</button></div>`;showPage("member")}
function factFull(l,v){return `<div class="full-fact"><span>${l}</span><b>${esc(v||"—")}</b></div>`}

function openMemberEditor(id){
 const m=getMember(id);editingMemberId=id;editingPhoto=m.data.photo||"";
 const fields=["birthName","stageName","koreanName","japaneseName","chineseName","nationality","birthplace","height","zodiacSign","representativeAnimal","summerMoonCharacter","occupation"];
 const labels={"birthName":"Birth Name","stageName":"Stage Name","koreanName":"Korean Name","japaneseName":"Japanese Name","chineseName":"Chinese Name","nationality":"Nationality","birthplace":"Birthplace","height":"Height","zodiacSign":"Zodiac Sign","representativeAnimal":"Representative Animal","summerMoonCharacter":"Summer Moon Character","occupation":"Occupation"};
 openModal(`<button class="close" onclick="closeModal()">×</button><h3>Edit ${m.name}</h3><div class="form"><label>Member Photo</label><input type="file" accept="image/*" onchange="memberPhoto(event)">${fields.map(k=>`<div><label>${labels[k]}</label><input id="mf-${k}" value="${esc(m.data[k]||"")}"></div>`).join("")}<div class="form-actions"><button class="light-btn" onclick="closeModal()">Cancel</button><button class="black-btn" onclick="saveMember()">Save</button></div></div>`);
}
function memberPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>editingPhoto=r.result;r.readAsDataURL(f)}
function saveMember(){
 const arr=members(),m=arr.find(x=>x.id===editingMemberId);if(!m)return;
 ["birthName","stageName","koreanName","japaneseName","chineseName","nationality","birthplace","height","zodiacSign","representativeAnimal","summerMoonCharacter","occupation"].forEach(k=>m.data[k]=document.getElementById("mf-"+k).value.trim());
 m.data.photo=editingPhoto;save(KEYS.members,arr);closeModal();renderProfile();toast("Profile saved")}
function calendarTabs(){return [["illit","ILLIT"],...members().map(m=>[m.id,m.name])]}
function renderCalendar(){
 const y=calDate.getFullYear(),mo=calDate.getMonth(),monthName=calDate.toLocaleDateString("en-US",{month:"long",year:"numeric"});
 const events=load(KEYS.calendar,[]).filter(e=>e.member===calendarTab).filter(e=>{const d=new Date(e.date+"T00:00:00");return d.getFullYear()===y&&d.getMonth()===mo}).sort((a,b)=>a.date.localeCompare(b.date));
 const groups={};events.forEach(e=>(groups[e.date]??=[]).push(e));
 document.getElementById("page-calendar").innerHTML=`<div class="heading"><h2>Calendar</h2><p>group and individual activities</p></div><div class="tabs">${calendarTabs().map(t=>`<button class="tab ${memberLabelClass(t[0])} ${calendarTab===t[0]?"active":""}" onclick="calendarTab='${t[0]}';renderCalendar()">${t[1]}</button>`).join("")}</div><div class="calendar"><div class="calendar-top"><div class="month">${monthName}</div><div class="month-btns"><button onclick="changeMonth(-1)">‹</button><button onclick="changeMonth(1)">›</button></div></div>${events.length?Object.keys(groups).map(date=>{const d=new Date(date+"T00:00:00");return `<div class="day"><div class="dayhead"><b>${d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</b><span>${d.getFullYear()}</span></div>${groups[date].map(e=>`<div class="event"><div class="event-star" style="color:${memberColor(e.member)}">★</div><div class="event-main"><div class="event-title">${esc(e.title)}</div><div class="event-meta">${esc(e.time||"")} ${e.time?"· ":""}${memberName(e.member)}</div>${e.description?`<div class="event-desc">${esc(e.description)}</div>`:""}</div><div class="event-actions"><button class="tiny" onclick="openCalendarEditor('${e.id}')">✎</button><button class="tiny" onclick="deleteCalendar('${e.id}')">×</button></div></div>`).join("")}</div>`}).join(""):`<div class="empty">No events for this month.</div>`}</div>`;
}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function openCalendarEditor(id=null){
 const e=id?load(KEYS.calendar,[]).find(x=>x.id===id):null;
 openModal(`<button class="close" onclick="closeModal()">×</button><h3>${e?"Edit Event":"Add Event"}</h3><div class="form"><div><label>Archive</label><select id="ce-member"><option value="illit" ${e?.member==="illit"?"selected":""}>ILLIT</option>${members().map(m=>`<option value="${m.id}" ${e?.member===m.id?"selected":""}>${m.name}</option>`).join("")}</select></div><div><label>Date</label><input id="ce-date" type="date" value="${e?.date||new Date().toISOString().slice(0,10)}"></div><div><label>Event</label><input id="ce-title" value="${esc(e?.title||"")}"></div><div><label>Time</label><input id="ce-time" value="${esc(e?.time||"")}"></div><div><label>Description</label><textarea id="ce-desc">${esc(e?.description||"")}</textarea></div><div class="form-actions"><button class="light-btn" onclick="closeModal()">Cancel</button><button class="black-btn" onclick="saveCalendar('${id||""}')">Save</button></div></div>`);
}
function saveCalendar(id){
 const a=load(KEYS.calendar,[]),obj={id:id||Date.now().toString(),member:document.getElementById("ce-member").value,date:document.getElementById("ce-date").value,title:document.getElementById("ce-title").value.trim(),time:document.getElementById("ce-time").value.trim(),description:document.getElementById("ce-desc").value.trim()};
 if(!obj.title||!obj.date){toast("Add a title and date");return}const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=obj;else a.push(obj);save(KEYS.calendar,a);closeModal();renderCalendar();toast("Event saved")}
function deleteCalendar(id){if(confirm("Delete this event?")){save(KEYS.calendar,load(KEYS.calendar,[]).filter(x=>x.id!==id));renderCalendar();toast("Event deleted")}}

function activityTabs(){return [["illit","ILLIT"],...members().map(m=>[m.id,m.name])]}
function renderActivities(){
 const all=load(KEYS.activities,[]).filter(x=>x.member===activityTab),shown=activityFilter==="all"?all:all.filter(x=>x.type===activityFilter);
 document.getElementById("page-activities").innerHTML=`<div class="heading"><h2>Activities</h2><p>organize individual and group activities</p></div><div class="tabs">${activityTabs().map(t=>`<button class="tab ${memberLabelClass(t[0])} ${activityTab===t[0]?"active":""}" onclick="activityTab='${t[0]}';activityFilter='all';renderActivities()">${t[1]}</button>`).join("")}</div><div class="filters">${Object.keys(TYPES).map(k=>`<button class="filter ${activityFilter===k?"active":""}" onclick="activityFilter='${k}';renderActivities()">${TYPES[k]} ${TYPE_LABEL[k]}</button>`).join("")}<button class="filter ${activityFilter==="all"?"active":""}" onclick="activityFilter='all';renderActivities()">All</button></div><div class="activity-tools"><span class="count">${shown.length} item${shown.length===1?"":"s"}</span><button class="add-btn" onclick="openActivityEditor()">+ Add</button></div><div class="activity-list">${shown.length?shown.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(a=>`<div class="activity"><div class="activity-top"><div class="activity-icon">${TYPES[a.type]||"✦"}</div><div class="activity-body"><div class="activity-title">${esc(a.title)}</div><div class="activity-date">${esc(a.date||"")}</div><div class="activity-member" style="color:${memberColor(a.member)}">${memberName(a.member)}</div>${a.description?`<div class="activity-desc">${esc(a.description)}</div>`:""}${a.link?`<a class="activity-link" href="${esc(a.link)}" target="_blank" rel="noopener">open link ↗</a>`:""}</div></div><div class="activity-actions"><button onclick="openActivityEditor('${a.id}')">✎ Edit</button><button onclick="deleteActivity('${a.id}')">× Delete</button></div></div>`).join(""):`<div class="empty">No activities here yet.<br>Add the first one with + Add.</div>`}</div>`;
}
function openActivityEditor(id=null){
 const a=id?load(KEYS.activities,[]).find(x=>x.id===id):null;
 openModal(`<button class="close" onclick="closeModal()">×</button><h3>${a?"Edit Activity":"Add Activity"}</h3><div class="form"><div><label>Archive / Member</label><select id="ae-member"><option value="illit" ${a?.member==="illit"?"selected":""}>ILLIT</option>${members().map(m=>`<option value="${m.id}" ${a?.member===m.id?"selected":""}>${m.name}</option>`).join("")}</select></div><div><label>Activity Type</label><select id="ae-type">${Object.keys(TYPES).map(k=>`<option value="${k}" ${a?.type===k?"selected":""}>${TYPES[k]} ${TYPE_LABEL[k]}</option>`).join("")}</select></div><div><label>Title</label><input id="ae-title" value="${esc(a?.title||"")}"></div><div><label>Date</label><input id="ae-date" type="date" value="${a?.date||""}"></div><div><label>Link</label><input id="ae-link" type="url" placeholder="https://" value="${esc(a?.link||"")}"></div><div><label>Description</label><textarea id="ae-desc">${esc(a?.description||"")}</textarea></div><div class="form-actions"><button class="light-btn" onclick="closeModal()">Cancel</button><button class="black-btn" onclick="saveActivity('${id||""}')">Save</button></div></div>`);
}
function saveActivity(id){
 const a=load(KEYS.activities,[]),obj={id:id||Date.now().toString(),member:document.getElementById("ae-member").value,type:document.getElementById("ae-type").value,title:document.getElementById("ae-title").value.trim(),date:document.getElementById("ae-date").value,link:document.getElementById("ae-link").value.trim(),description:document.getElementById("ae-desc").value.trim()};
 if(!obj.title){toast("Add a title");return}const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=obj;else a.push(obj);save(KEYS.activities,a);closeModal();renderActivities();renderStatus();toast("Activity saved")}
function deleteActivity(id){if(confirm("Delete this activity?")){save(KEYS.activities,load(KEYS.activities,[]).filter(x=>x.id!==id));renderActivities();renderStatus();toast("Activity deleted")}}

function monthKey(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")}
function monthLabel(k){const [y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("en-US",{month:"short",year:"numeric"})}
function renderStatus(){
 const acts=load(KEYS.activities,[]),keys=acts.map(a=>monthKey(a.date)).filter(Boolean).sort();
 let months=[];if(keys.length){let [sy,sm]=keys[0].split("-").map(Number),d=new Date(sy,sm-1,1);d.setMonth(d.getMonth()-1);const end=new Date();while(d<=new Date(end.getFullYear(),end.getMonth(),1)){months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));d.setMonth(d.getMonth()+1)}}else{const n=new Date();months=[n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")]}
 const ids=["illit",...members().map(m=>m.id)],max=Math.max(1,...ids.map(id=>{let c=0;return months.map(k=>{c+=acts.filter(a=>monthKey(a.date)===k&&(id==="illit"||a.member===id)).length;return c}).at(-1)}));
 const points=id=>{let c=0;return months.map(k=>{c+=acts.filter(a=>monthKey(a.date)===k&&(id==="illit"||a.member===id)).length;return c})};
 const paths=ids.map(id=>{const p=points(id),w=640/(Math.max(1,months.length-1));return `<polyline fill="none" stroke="${id==="illit"?"#111":memberColor(id)}" stroke-width="${id==="illit"?3:2}" points="${p.map((v,i)=>`${i*w},${260-(v/max)*250}`).join(" ")}"/>`}).join("");
 const totals=ids.map(id=>`<div class="total"><b>${points(id).at(-1)||0}</b><span>${memberName(id)}</span></div>`).join("");
 document.getElementById("page-status").innerHTML=`<div class="heading"><h2>Status</h2><p>activity evolution over time</p></div><div class="status-card"><p class="status-intro">The graph updates automatically as activities are added to the archive.</p><div class="chart-scroll"><div class="chart"><div class="grid">${[0,1,2,3,4].map(()=>"<div></div>").join("")}</div><div class="ylab"><span>${max}</span><span>${Math.round(max*.75)}</span><span>${Math.round(max*.5)}</span><span>${Math.round(max*.25)}</span><span>0</span></div><svg class="svg" viewBox="0 0 640 260" preserveAspectRatio="none">${paths}</svg><div class="xlab">${months.map(k=>`<span>${monthLabel(k)}</span>`).join("")}</div></div></div><div class="legend">${ids.map(id=>`<span><i class="dot" style="background:${id==="illit"?"#111":memberColor(id)}"></i>${memberName(id)}</span>`).join("")}</div><div class="summary">${totals}</div></div>`;
}

function renderSettings(){
 const logo=localStorage.getItem(KEYS.logo);
 document.getElementById("page-settings").innerHTML=`<div class="heading"><h2>Settings</h2><p>manage your archive</p></div><div class="settings">
 <div class="setting-card"><div class="setting-title">Site / Logo Image</div><div class="setting-desc">Upload the image you want to use as the archive logo.</div><div class="logo-preview">${logo?`<img src="${logo}">`:"✦"}</div><input type="file" accept="image/*" onchange="saveLogo(event)">${logo?`<button class="danger-btn" style="margin-top:9px" onclick="removeLogo()">Remove Logo</button>`:""}</div>
 <div class="setting-card"><div class="setting-title">Backup Archive</div><div class="setting-desc">Export your members, calendar, activities and logo as one JSON backup.</div><button class="black-btn" onclick="exportBackup()">Export Backup</button></div>
 <div class="setting-card"><div class="setting-title">Import Backup</div><div class="setting-desc">Restore an archive backup saved on your phone.</div><input type="file" accept=".json,application/json" onchange="importBackup(event)"></div>
 <div class="setting-card"><div class="setting-title">Reset Archive</div><div class="setting-desc">Delete all saved archive data from this browser.</div><button class="danger-btn" onclick="resetArchive()">Reset Archive</button></div></div>`;
}
function saveLogo(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{localStorage.setItem(KEYS.logo,r.result);header();renderSettings();toast("Logo saved")};r.readAsDataURL(f)}
function removeLogo(){localStorage.removeItem(KEYS.logo);header();renderSettings();toast("Logo removed")}
function exportBackup(){
 const data={members:members(),calendar:load(KEYS.calendar,[]),activities:load(KEYS.activities,[]),logo:localStorage.getItem(KEYS.logo)||""};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="illit-archive-backup.json";a.click();URL.revokeObjectURL(url);toast("Backup created")}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.members)save(KEYS.members,d.members);if(d.calendar)save(KEYS.calendar,d.calendar);if(d.activities)save(KEYS.activities,d.activities);if(d.logo)localStorage.setItem(KEYS.logo,d.logo);header();renderSettings();renderProfile();renderCalendar();renderActivities();renderStatus();toast("Backup imported")}catch(x){toast("Invalid backup file")}};r.readAsText(f)}
function resetArchive(){if(!confirm("Delete all archive data?"))return;if(!confirm("This cannot be undone. Continue?"))return;Object.values(KEYS).forEach(k=>localStorage.removeItem(k));toast("Archive reset");setTimeout(()=>location.reload(),500)}

function init(){header();nav();renderHome();document.getElementById("floating").style.display="none"}
init();
</script>
</body>
</html>
