<script>

/* =========================================================
   STATS STATE
========================================================= */

let statsMonth =
  new Date().getMonth();

let statsYear =
  new Date().getFullYear();



/* =========================================================
   GET ALL TRACKED ITEMS
========================================================= */

function getAllTrackedActivities(){

  const activities =
    getActivities();


  return activities.filter(
    activity =>
      Array.isArray(
        activity.members
      ) &&
      activity.members.length
  );

}



/* =========================================================
   MEMBER ACTIVITY COUNT
========================================================= */

function getMemberActivityCount(
  memberId,
  activities = null
){

  const list =
    activities ||
    getAllTrackedActivities();


  return list.filter(
    activity =>
      Array.isArray(
        activity.members
      ) &&
      activity.members.includes(
        memberId
      )
  ).length;

}



/* =========================================================
   MONTH ACTIVITY COUNT
========================================================= */

function getMonthActivityCount(
  year,
  month
){

  const activities =
    getAllTrackedActivities();


  return activities.filter(
    activity => {

      const parts =
        activity.date.split("-");


      if(parts.length !== 3){

        return false;

      }


      return (
        Number(parts[0]) === year &&
        Number(parts[1]) === month + 1
      );

    }
  );

}



/* =========================================================
   YEAR ACTIVITY COUNT
========================================================= */

function getYearActivityCount(
  year
){

  const activities =
    getAllTrackedActivities();


  return activities.filter(
    activity => {

      const parts =
        activity.date.split("-");


      return (
        parts.length === 3 &&
        Number(parts[0]) === year
      );

    }
  );

}



/* =========================================================
   PERCENTAGE
========================================================= */

function calculatePercentage(
  count,
  total
){

  if(!total){

    return 0;

  }


  return Math.round(
    (count / total) * 100
  );

}



/* =========================================================
   GET AVAILABLE YEARS
========================================================= */

function getAvailableStatsYears(){

  const activities =
    getAllTrackedActivities();


  const years =
    activities
      .map(
        activity =>
          Number(
            activity.date.split("-")[0]
          )
      )
      .filter(
        year =>
          !isNaN(year)
      );


  const currentYear =
    new Date().getFullYear();


  years.push(
    currentYear
  );


  return [
    ...new Set(years)
  ].sort(
    (a,b) =>
      b-a
  );

}



/* =========================================================
   CHANGE STATS MONTH
========================================================= */

function changeStatsMonth(
  value
){

  statsMonth =
    Number(value);


  renderStats();

}



/* =========================================================
   CHANGE STATS YEAR
========================================================= */

function changeStatsYear(
  value
){

  statsYear =
    Number(value);


  renderStats();

}



/* =========================================================
   RENDER STATS
========================================================= */

function renderStats(){

  const page =
    document.getElementById(
      "statsPage"
    );


  if(!page){

    return;

  }


  const members =
    getMembers();


  const allActivities =
    getAllTrackedActivities();


  const monthActivities =
    getMonthActivityCount(
      statsYear,
      statsMonth
    );


  const yearActivities =
    getYearActivityCount(
      statsYear
    );


  const total =
    allActivities.length;


  const years =
    getAvailableStatsYears();


  const monthNames = [

    "january",
    "february",
    "march",
    "april",
    "may",
    "june",
    "july",
    "august",
    "september",
    "october",
    "november",
    "december"

  ];


  /*
   * count activities for each member
   */

  const memberStats =
    members.map(
      member => {

        const count =
          getMemberActivityCount(
            member.id,
            allActivities
          );


        const monthCount =
          getMemberActivityCount(
            member.id,
            monthActivities
          );


        const yearCount =
          getMemberActivityCount(
            member.id,
            yearActivities
          );


        return {

          ...member,

          count:count,

          monthCount:monthCount,

          yearCount:yearCount

        };

      }
    );


  const sorted =
    [...memberStats].sort(
      (a,b) =>
        b.count - a.count
    );


  const highest =
    sorted.length
      ? sorted[0]
      : null;


  const lowest =
    sorted.length
      ? sorted[sorted.length - 1]
      : null;


  const maxCount =
    highest
      ? highest.count
      : 0;


  const monthMax =
    Math.max(
      ...memberStats.map(
        member =>
          member.monthCount
      ),
      1
    );


  const yearMax =
    Math.max(
      ...memberStats.map(
        member =>
          member.yearCount
      ),
      1
    );


  page.innerHTML = `

    <div class="page-heading">

      <h1>
        Statistics
      </h1>

      <p>
        activity balance between members
      </p>

    </div>


    <!-- TOTAL -->

    <div class="stats-card">

      <div class="stats-total">

        <div class="stats-total-number">

          ${total}

        </div>

        <div class="stats-total-label">

          total tracked activities

        </div>

      </div>


      <div class="stats-highlight">

        <div class="stats-highlight-box">

          <div class="stats-highlight-label">
            most activities
          </div>

          ${
            highest
            ?

            `

              <div
                class="stats-highlight-name"
                style="color:${escapeHTML(highest.color || "#111")}"
              >
                ${escapeHTML(
                  highest.name.toLowerCase()
                )}
              </div>

              <div class="stats-highlight-number">
                ${highest.count} activities
              </div>

            `

            :

            `

              <div class="stats-highlight-name">
                —
              </div>

            `
          }

        </div>


        <div class="stats-highlight-box">

          <div class="stats-highlight-label">
            least activities
          </div>

          ${
            lowest
            ?

            `

              <div
                class="stats-highlight-name"
                style="color:${escapeHTML(lowest.color || "#111")}"
              >
                ${escapeHTML(
                  lowest.name.toLowerCase()
                )}
              </div>

              <div class="stats-highlight-number">
                ${lowest.count} activities
              </div>

            `

            :

            `

              <div class="stats-highlight-name">
                —
              </div>

            `
          }

        </div>

      </div>

    </div>



    <!-- MEMBER BALANCE -->

    <div class="stats-card">

      <div class="stats-title">
        member activity
      </div>

      <div class="stats-subtitle">
        total activities tracked for each member
      </div>


      ${
        memberStats.map(
          member => {

            const width =
              maxCount
                ? Math.round(
                    member.count /
                    maxCount *
                    100
                  )
                : 0;


            const percentage =
              calculatePercentage(
                member.count,
                total
              );


            return `

              <div class="stat-member">

                <div class="stat-member-top">

                  <div class="stat-member-name">

                    <span>
                      ${escapeHTML(
                        member.emoji || "♡"
                      )}
                    </span>

                    <span
                      style="
                        color:${escapeHTML(
                          member.color || "#111"
                        )}
                      "
                    >
                      ${escapeHTML(
                        member.name.toLowerCase()
                      )}
                    </span>

                  </div>


                  <div class="stat-member-count">

                    ${member.count}

                  </div>

                </div>


                <div class="stat-bar">

                  <div
                    class="stat-bar-fill"
                    style="
                      width:${width}%;
                      background:${escapeHTML(
                        member.color || "#999"
                      )};
                    "
                  ></div>

                </div>


                <div class="stat-percent">

                  ${percentage}% of all tracked activities

                </div>

              </div>

            `;

          }
        ).join("")
      }

    </div>



    <!-- MONTH -->

    <div class="stats-card">

      <div class="stats-title">
        monthly statistics
      </div>

      <div class="stats-subtitle">
        percentage and activity count for each member
      </div>


      <div class="stats-filter-row">

        <select
          class="stats-select"
          onchange="changeStatsMonth(this.value)"
        >

          ${
            monthNames.map(
              (name,index) => `

                <option
                  value="${index}"
                  ${index === statsMonth ? "selected" : ""}
                >
                  ${name}
                </option>

              `
            ).join("")
          }

        </select>


        <select
          class="stats-select"
          onchange="changeStatsYear(this.value)"
        >

          ${
            years.map(
              year => `

                <option
                  value="${year}"
                  ${year === statsYear ? "selected" : ""}
                >
                  ${year}
                </option>

              `
            ).join("")
          }

        </select>

      </div>


      <div
        style="
          font-size:12px;
          color:var(--secondary);
          margin-bottom:15px;
        "
      >

        ${monthNames[statsMonth]}
        ${statsYear}

        ·

        ${monthActivities.length}
        activities

      </div>


      ${
        memberStats.map(
          member => {

            const percentage =
              calculatePercentage(
                member.monthCount,
                monthActivities.length
              );


            const width =
              monthMax
                ? Math.round(
                    member.monthCount /
                    monthMax *
                    100
                  )
                : 0;


            return `

              <div
                class="stats-breakdown-row"
              >

                <div
                  class="stats-breakdown-label"
                  style="
                    color:${escapeHTML(
                      member.color || "#555"
                    )}
                  "
                >
                  ${escapeHTML(
                    member.name.toLowerCase()
                  )}
                </div>


                <div
                  class="stats-breakdown-track"
                >

                  <div
                    class="stats-breakdown-fill"
                    style="
                      width:${width}%;
                      background:${escapeHTML(
                        member.color || "#999"
                      )};
                    "
                  ></div>

                </div>


                <div
                  class="stats-breakdown-number"
                >
                  ${percentage}%
                </div>

              </div>

            `;

          }
        ).join("")
      }

    </div>



    <!-- YEAR -->

    <div class="stats-card">

      <div class="stats-title">
        yearly statistics
      </div>

      <div class="stats-subtitle">
        activity distribution throughout the year
      </div>


      <div
        style="
          font-size:12px;
          color:var(--secondary);
          margin-bottom:15px;
        "
      >

        ${statsYear}

        ·

        ${yearActivities.length}
        activities

      </div>


      ${
        memberStats.map(
          member => {

            const percentage =
              calculatePercentage(
                member.yearCount,
                yearActivities.length
              );


            const width =
              yearMax
                ? Math.round(
                    member.yearCount /
                    yearMax *
                    100
                  )
                : 0;


            return `

              <div
                class="stats-breakdown-row"
              >

                <div
                  class="stats-breakdown-label"
                  style="
                    color:${escapeHTML(
                      member.color || "#555"
                    )}
                  "
                >
                  ${escapeHTML(
                    member.name.toLowerCase()
                  )}
                </div>


                <div
                  class="stats-breakdown-track"
                >

                  <div
                    class="stats-breakdown-fill"
                    style="
                      width:${width}%;
                      background:${escapeHTML(
                        member.color || "#999"
                      )};
                    "
                  ></div>

                </div>


                <div
                  class="stats-breakdown-number"
                >
                  ${percentage}%
                </div>

              </div>

            `;

          }
        ).join("")
      }

    </div>



    <!-- DATA BACKUP -->

    <div class="stats-card">

      <div class="stats-title">
        data
      </div>

      <div class="stats-subtitle">
        backup your archive data
      </div>


      <div class="data-buttons">

        <button
          class="secondary-button"
          onclick="exportArchiveData()"
        >
          export
        </button>


        <button
          class="secondary-button"
          onclick="document.getElementById('importArchiveInput').click()"
        >
          import
        </button>

      </div>


      <input
        type="file"
        id="importArchiveInput"
        class="hidden-file-input"
        accept=".json,application/json"
        onchange="importArchiveData(event)"
      >

    </div>

  `;

}



/* =========================================================
   EXPORT DATA
========================================================= */

function exportArchiveData(){

  const data = {

    version:1,

    exportedAt:
      new Date().toISOString(),

    members:
      getMembers(),

    activities:
      getActivities(),

    folders:
      getFolders(),

    schedules:
      getSchedules()

  };


  const json =
    JSON.stringify(
      data,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "illit-archive-backup.json";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  URL.revokeObjectURL(
    url
  );


  showToast(
    "backup exported ♡"
  );

}



/* =========================================================
   IMPORT DATA
========================================================= */

function importArchiveData(event){

  const file =
    event.target.files &&
    event.target.files[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const data =
          JSON.parse(
            e.target.result
          );


        if(
          !data ||
          typeof data !== "object"
        ){

          throw new Error(
            "invalid"
          );

        }


        if(
          Array.isArray(
            data.members
          )
        ){

          saveMembers(
            data.members
          );

        }


        if(
          Array.isArray(
            data.activities
          )
        ){

          saveActivities(
            data.activities
          );

        }


        if(
          Array.isArray(
            data.folders
          )
        ){

          saveFolders(
            data.folders
          );

        }


        if(
          Array.isArray(
            data.schedules
          )
        ){

          saveSchedules(
            data.schedules
          );

        }


        renderHomeMembers();

        renderProfileList();

        renderActivities();

        renderSchedule();

        renderCalendar();

        renderStats();


        showToast(
          "backup imported ♡"
        );


      }catch(error){

        showToast(
          "could not import this file"
        );

      }


      event.target.value = "";

    };


  reader.readAsText(
    file
  );

}



/* =========================================================
   FIX PROFILE SAVE
   This replaces the function from part 3.
========================================================= */

function saveMemberProfile(){

  if(!editingMemberId){

    return;

  }


  const savedMemberId =
    editingMemberId;


  const members =
    getMembers();


  const member =
    members.find(
      item =>
        item.id ===
        savedMemberId
    );


  if(!member){

    return;

  }


  member.name =
    document
      .getElementById(
        "editMemberName"
      )
      .value
      .trim() ||
    member.name;


  member.korean =
    document
      .getElementById(
        "editMemberKorean"
      )
      .value
      .trim();


  member.description =
    document
      .getElementById(
        "editMemberDescription"
      )
      .value
      .trim();


  member.photo =
    editingMemberPhoto || "";


  const fieldInputs =
    document.querySelectorAll(
      ".member-field-editor"
    );


  const fields = [];


  fieldInputs.forEach(
    field => {

      const label =
        field
          .querySelector(
            ".member-field-label-input"
          )
          ?.value
          .trim();


      const value =
        field
          .querySelector(
            ".member-field-value-input"
          )
          ?.value
          .trim();


      if(label){

        fields.push({

          label:label,

          value:value || ""

        });

      }

    }
  );


  member.fields =
    fields;


  saveMembers(
    members
  );


  closeProfileEditor();


  renderHomeMembers();

  renderProfileList();


  openMemberProfile(
    savedMemberId
  );


  showToast(
    "profile updated ♡"
  );

}



/* =========================================================
   FIX MEMBER PROFILE OPENING
========================================================= */

function openMemberProfile(memberId){

  const members =
    getMembers();


  const member =
    members.find(
      item =>
        item.id ===
        memberId
    );


  if(!member){

    return;

  }


  const profilePage =
    document.getElementById(
      "profilePage"
    );


  const detailPage =
    document.getElementById(
      "profileDetailPage"
    );


  const detail =
    document.getElementById(
      "profileDetail"
    );


  if(profilePage){

    profilePage.classList.remove(
      "active"
    );

  }


  if(detailPage){

    detailPage.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(".page")
    .forEach(
      page => {

        if(
          page !== detailPage
        ){

          page.classList.remove(
            "active"
          );

        }

    );


  detail.innerHTML = `

    <div
      style="
        margin-bottom:15px;
      "
    >

        class="secondary-button"
        onclick="showPage('profile')"
      >

    </div>


    <div class="profile-detail-card">

      <div class="profile-detail-photo-wrap">

        ${
          member.photo

          ?

          `<img
            class="profile-detail-photo"
            src="${member.photo}"
            alt=""
          >`

          :

          `

            <div
              class="profile-detail-placeholder"
              style="
                background:${escapeHTML(
                  member.color || "#f2f2f7"
                )}22;
                color:${escapeHTML(
                  member.color || "#111"
                )};
              "
            >
              ${escapeHTML(
                member.emoji || "♡"
              )}
            </div>

          `
        }

      </div>


      <div
        class="profile-detail-name"
        style="
          color:${escapeHTML(
            member.color || "#111"
          )};
        "
      >

        ${escapeHTML(
          member.name
        )}

      </div>


      <div class="profile-detail-korean">

        ${escapeHTML(
          member.korean || ""
        )}

      </div>


      ${
        member.description

        ?

        `<div class="profile-detail-description">

          ${escapeHTML(
            member.description
          )}

        </div>`

        :

        ""
      }


      <div class="profile-fields">

        ${
          Array.isArray(
            member.fields
          ) && member.fields.length

          ?

          member.fields
            .map(
              field => `

                <div class="profile-field">

                  <div class="profile-field-label">

                    ${escapeHTML(
                      field.label || ""
                    )}

                  </div>

                  <div class="profile-field-value">

                    ${escapeHTML(
                      field.value || ""
                    )}

                  </div>

              `
            )
            .join("")

          :

          `

            <div
              style="
                color:#8e8e93;
                font-size:12px;
                text-align:center;
                padding:10px;
              "
            >
              add information using edit profile

        }

      </div>


      <button
        class="primary-button"
        style="
          width:100%;
          margin-top:15px;

        onclick="editMember('${member.id}')"

        edit profile

  `;
