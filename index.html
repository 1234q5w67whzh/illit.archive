select{

    cursor:pointer;

input,

   ========================================================= */

   GLASS
   ========================================================= */

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:

    border-radius:
        var(--radius);
}

/* =========================================================
   PÁGINAS
   ========================================================= */

.page{
    display:none;

    animation:
        pageAppear .25s ease;
}

.page.active{
    display:block;
}

@keyframes pageAppear{

    from{
        opacity:0;
        transform:
            translateY(5px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

   CABEÇALHO
   ========================================================= */

        2px

.archive-item-title{

.archive-item-subtitle{

    text-overflow:ellipsis;

   ESTADO VAZIO
   ========================================================= */

    padding:

    text-align:center;

    color:var(--secondary);

    font-size:13px;

    line-height:1.5;

/* =========================================================
   RESPONSIVO
   ========================================================= */

/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_KEY = "illit_archive_ios_v3";

function cloneData(data){

    return JSON.parse(
        JSON.stringify(data)
    );

}

function loadData(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!saved){

            return cloneData(
                DEFAULT_DATA
            );

        }

        const parsed =
            JSON.parse(saved);

        return mergeData(
            cloneData(DEFAULT_DATA),
            parsed
        );

    }catch(error){

        console.warn(
            "Não foi possível carregar os dados.",
            error
        );

        return cloneData(
            DEFAULT_DATA
        );

    }

}

function mergeData(base, saved){

    if(!saved || typeof saved !== "object"){

        return base;

    }

    Object.keys(saved).forEach(key => {

        if(
            saved[key] !== null &&
            typeof saved[key] === "object" &&
            !Array.isArray(saved[key]) &&
            typeof base[key] === "object" &&
            !Array.isArray(base[key])
        ){

            base[key] =
                mergeData(
                    base[key],
                    saved[key]
                );

        }else{

            base[key] =
                saved[key];

        }

    });

    return base;

}

let DATA = loadData();

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(DATA)
        );

    }catch(error){

        console.warn(
            "Erro ao salvar os dados.",
            error
        );

    }

}

/* =========================================================
   DATAS E CONTADORES
   ========================================================= */

function startOfDay(date){

    const d =
        new Date(date);

    d.setHours(
        0,0,0,0
    );

    return d;

}

function differenceCalendar(startDate, endDate){

    let start =
        new Date(startDate);

    let end =
        new Date(endDate);

    if(end < start){

        return {
            years: 0,
            months: 0,
            days: 0,
            totalDays: 0
        };

    }

    let years =
        end.getFullYear() -
        start.getFullYear();

    let months =
        end.getMonth() -
        start.getMonth();

    let days =
        end.getDate() -
        start.getDate();

    if(days < 0){

        months--;

        const previousMonth =
            new Date(
                end.getFullYear(),
                end.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();

    }

    if(months < 0){

        years--;

        months += 12;

    }

    const totalDays =
        Math.floor(
            (
                startOfDay(end) -
                startOfDay(start)
            ) /
            86400000
        );

    return {
        years,
        months,
        days,
        totalDays
    };

}

function anniversaryText(dateString){

    const start =
        new Date(
            dateString +
            "T00:00:00"
        );

    const now =
        new Date();

    const diff =
        differenceCalendar(
            start,
            now
        );

    return (
        diff.years +
        " anos · " +
        diff.months +
        " meses · " +
        diff.days +
        " dias"
    );

}

function daysSince(dateString){

    const start =
        startOfDay(
            new Date(
                dateString +
                "T00:00:00"
            )
        );

    const now =
        startOfDay(
            new Date()
        );

    return Math.max(
        0,
        Math.floor(
            (now - start) /
            86400000
        )
    );

}

/* =========================================================
   IDADE / ANIVERSÁRIOS
   ========================================================= */

function getAge(birthday){

    const birth =
        new Date(
            birthday +
            "T00:00:00"
        );

    const now =
        new Date();

    let age =
        now.getFullYear() -
        birth.getFullYear();

    const month =
        now.getMonth() -
        birth.getMonth();

    if(
        month < 0 ||
        (
            month === 0 &&
            now.getDate() < birth.getDate()
        )
    ){

        age--;

    }

    return age;

}

function nextBirthday(memberId){

    const member =
        memberData(memberId);

    if(!member || !member.birthday){

        return null;

    }

    const birth =
        new Date(
            member.birthday +
            "T00:00:00"
        );

    const now =
        new Date();

    let next =
        new Date(
            now.getFullYear(),
            birth.getMonth(),
            birth.getDate()
        );

    if(next < startOfDay(now)){

        next =
            new Date(
                now.getFullYear() + 1,
                birth.getMonth(),
                birth.getDate()
            );

    }

    return next;

}

function birthdayCountdown(memberId){

    const next =
        nextBirthday(memberId);

    if(!next){

        return null;

    }

    const today =
        startOfDay(
            new Date()
        );

    const birthday =
        startOfDay(next);

    const days =
        Math.round(
            (
                birthday -
                today
            ) /
            86400000
        );

    return days;

}

            return {
                ...event,
                _start: start,
                _end: end
            };

            event._end >= now
        )

        .sort(
            (a,b) =>

        );

function countdownParts(target){

    const now =
        new Date();

    const diff =
        Math.max(
            0,
            target - now
        );

    const totalSeconds =
        Math.floor(
            diff / 1000
        );

    const days =
        Math.floor(
            totalSeconds /
            86400
        );

    const hours =
        Math.floor(
            (
                totalSeconds %
                86400
            ) /
            3600
        );

    const minutes =
        Math.floor(
            (
                totalSeconds %
                3600
            ) /
            60
        );

    const seconds =
        totalSeconds %
        60;

    return {
        days,
        hours,
        minutes,
        seconds,
        released:
            diff <= 0
    };

}

function getReleasedAlbums(country){

    const now =
        new Date();

    return DATA.albums

        .filter(album => {

            if(album.country !== country){

                return false;

            }

            const release =
                new Date(
                    album.date +
                    "T" +
                    (album.time || "00:00") +
                    (
                        country === "Korean"
                            ? "+09:00"
                            : "+09:00"
                    )
                );

            return release <= now;

        })

        .sort(
            (a,b) =>
                new Date(b.date) -
                new Date(a.date)
        );

}

function getLatestAlbum(country){

    const albums =
        getReleasedAlbums(country);

    return albums.length
        ? albums[0]
        : null;

}

function getAlbumCountdown(country){

    const latest =
        getLatestAlbum(country);

    if(!latest){

        return null;

    }

    const release =
        new Date(
            latest.date +
            "T00:00:00"
        );

    const now =
        new Date();

    return Math.max(
        0,
        Math.floor(
            (
                startOfDay(now) -
                startOfDay(release)
            ) /
            86400000
        )
    );

}

function periodStartDate(period){

    const now =
        new Date();

    if(period === "WEEK"){

        const day =
            now.getDay();

        const diff =
            day === 0
                ? 6
                : day - 1;

        const start =
            new Date(now);

        start.setDate(
            now.getDate() - diff
        );

        start.setHours(
            0,0,0,0
        );

        return start;

    }

    if(period === "YEAR"){

        return new Date(
            now.getFullYear(),
            0,
            1
        );

    }

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        1
    );

}

function statisticsActivities(){

    const start =
        periodStartDate(
            statisticsPeriod
        );

    return DATA.activities.filter(
        activity => {

            if(!activity.date){

                return false;

            }

            return new Date(
                activity.date +
                "T23:59:59"
            ) >= start;

        }
    );

}

function exportBackup(){

    const backup = {

        version: 3,

        exportedAt:
            new Date().toISOString(),

        data: DATA

    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "ILLIT_Archive_Backup.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}

function importBackupFile(file){

    if(!file){

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(){

            try{

                const imported =
                    JSON.parse(
                        reader.result
                    );

                const importedData =
                    imported.data ||
                    imported;

                DATA =
                    mergeData(
                        cloneData(
                            DEFAULT_DATA
                        ),
                        importedData
                    );

                saveData();

                alert(
                    "Backup importado com sucesso!"
                );

                renderCurrentPage();

            }catch(error){

                alert(
                    "Não foi possível importar este arquivo."
                );

            }

        };

    reader.readAsText(file);

}

function renderNextActivity(){

    const event =
        getNextActivity();

    if(!event){

        return `

            <section class="next-activity">

                <div class="next-label">
                    NEXT ACTIVITY
                </div>

                <div class="next-title">
                    Nenhuma atividade próxima
                </div>

                <div class="next-meta">
                    Adicione um evento no Calendário.
                </div>

            </section>

        `;

    }

    const member =
        memberData(event.member);

    const color =
        memberColor(event.member);

    const eventDate =
        new Date(
            event.date +
            "T" +
            (event.time || "00:00")
        );

    const now =
        new Date();

    const happening =
        eventDate <= now &&
        (
            !event.endTime ||
            new Date(
                event.date +
                "T" +
                event.endTime
            ) >= now
        );

    return `

        <section
            class="next-activity"
            style="
                --next-color:
                ${escapeHTML(color)}
            "
        >

            <div class="next-label">
                NEXT ACTIVITY
            </div>

            <div class="next-title">
                ${escapeHTML(event.title)}
            </div>

            <div class="next-meta">

                ${
                    member
                    ?
                    escapeHTML(member.name)
                    :
                    "ILLIT"
                }

                ·

                ${formatLongDate(event.date)}

                ${
                    event.time
                    ?
                    " · " +
                    escapeHTML(event.time)
                    :
                    ""
                }

            </div>

            ${
                happening
                ?
                `
                <div
                    class="next-now"
                    id="next-countdown"
                >
                    HAPPENING NOW
                </div>
                `
                :
                `
                <div
                    class="next-countdown"
                    id="next-countdown"
                    data-target="${escapeHTML(
                        eventDate.toISOString()
                    )}"
                >
                    —
                </div>
                `
            }

            ${
                event.location
                ?
                `
                <div class="next-meta">
                    📍 ${escapeHTML(event.location)}
                </div>
                `
                :
                ""
            }

        </section>

    `;

}

/* =========================================================
   CONTAGEM REGRESSIVA DA PRÓXIMA ATIVIDADE
   ========================================================= */

function nextActivityCountdownText(){

    const event =
        getNextActivity();

    if(!event){

        return "";

    }

    const now =
        new Date();

    const start =
        new Date(
            event.date +
            "T" +
            (event.time || "00:00")
        );

    let end = null;

    if(event.endTime){

        end =
            new Date(
                event.date +
                "T" +
                event.endTime
            );

    }

    if(
        now >= start &&
        (
            !end ||
            now <= end
        )
    ){

        return "HAPPENING NOW";

    }

    if(now > start){

        return "HAPPENING NOW";

    }

    let difference =
        start - now;

    const days =
        Math.floor(
            difference / 86400000
        );

    difference %= 86400000;

    const hours =
        Math.floor(
            difference / 3600000
        );

    difference %= 3600000;

    const minutes =
        Math.floor(
            difference / 60000
        );

    const seconds =
        Math.floor(
            (difference % 60000) /
            1000
        );

    if(days > 0){

        return (
            days +
            "d " +
            pad(hours) +
            "h " +
            pad(minutes) +
            "m"
        );

    }

    return (
        pad(hours) +
        ":" +
        pad(minutes) +
        ":" +
        pad(seconds)
    );

}

/* =========================================================
   TIMER PRINCIPAL
   ========================================================= */

function updateLiveCounters(){

    const debutCounter =
        document.getElementById(
            "debut-counter"
        );

    if(debutCounter){

        debutCounter.textContent =
            anniversaryText(
                DATA.group.debut
            );

    }

    const debutDays =
        document.getElementById(
            "debut-days"
        );

    if(debutDays){

        debutDays.textContent =
            daysSince(
                DATA.group.debut
            ) +
            " dias";

    }

    const gllitCounter =
        document.getElementById(
            "gllit-counter"
        );

    if(gllitCounter){

        gllitCounter.textContent =
            anniversaryText(
                "2024-09-01"
            );

    }

    const gllitDays =
        document.getElementById(
            "gllit-days"
        );

    if(gllitDays){

        gllitDays.textContent =
            daysSince(
                "2024-09-01"
            ) +
            " dias desde o nome GLLIT";

    }

    const breakCountdown =
        document.getElementById(
            "break-countdown"
        );

    if(breakCountdown){

        const value =
            countdownParts(
                getBreakEvenDate()
            );

        const days =
            breakCountdown.querySelector(
                '[data-break="days"]'
            );

        const hours =
            breakCountdown.querySelector(
                '[data-break="hours"]'
            );

        const minutes =
            breakCountdown.querySelector(
                '[data-break="minutes"]'
            );

        const seconds =
            breakCountdown.querySelector(
                '[data-break="seconds"]'
            );

        if(value.released){

            renderCurrentPage();

            return;

        }

        if(days){

            days.textContent =
                pad(value.days);

        }

        if(hours){

            hours.textContent =
                pad(value.hours);

        }

        if(minutes){

            minutes.textContent =
                pad(value.minutes);

        }

        if(seconds){

            seconds.textContent =
                pad(value.seconds);

        }

    }

    const nextCountdown =
        document.getElementById(
            "next-countdown"
        );

    if(nextCountdown){

        nextCountdown.textContent =
            nextActivityCountdownText();

    }

}

function startTimers(){

    stopTimers();

    if(
        currentPage === "home"
    ){

        homeTimer =
            setInterval(
                updateLiveCounters,
                1000
            );

    }

}

function stopTimers(){

    if(homeTimer){

        clearInterval(
            homeTimer
        );

        homeTimer = null;

    }

}

function filteredViews(){

        .filter(view => {

            const typeOK =
                viewsTypeFilter ===
                "ALL" ||
                view.type ===
                viewsTypeFilter;

            const memberOK =
                viewsMemberFilter ===
                "ALL" ||

                viewsMemberFilter;

            );

        );

}

/* =========================================================
   FORMATAR NÚMEROS
   ========================================================= */

function formatViews(
    value
){

    const number =
        Number(value) || 0;

    if(number >= 1000000000){

        return (
            (number / 1000000000)
                .toFixed(1)
                .replace(".0","")
            + "B"
        );

    }

    if(number >= 1000000){

        return (
            (number / 1000000)
                .toFixed(1)
                .replace(".0","")
            + "M"
        );

    }

    if(number >= 1000){

        return (
            (number / 1000)
                .toFixed(1)
                .replace(".0","")
            + "K"
        );

    }

    return number.toLocaleString(
        "pt-BR"
    );

}

/* =========================================================
   VIEWS TRACKER — GRÁFICO SVG
   ========================================================= */

function renderViewsChart(){

    const views =
        filteredViews();

    if(!views.length){

        return `

            <div class="chart-empty">

                Adicione medições para
                visualizar o gráfico.

            </div>

        `;

    }

    const width = 760;
    const height = 260;

    const paddingX = 35;
    const paddingY = 28;

    const values =
        views.map(
            item =>
                Number(
                    item.views
                ) || 0
        );

    const max =
        Math.max(
            ...values,
            1
        );

    const min =
        Math.min(
            ...values,
            0
        );

    const range =
        Math.max(
            max - min,
            1
        );

    const points =
        views.map(
            (view,index) => {

                const x =
                    paddingX +
                    (
                        index /
                        Math.max(
                            views.length - 1,
                            1
                        )
                    ) *
                    (
                        width -
                        paddingX * 2
                    );

                const y =
                    height -
                    paddingY -
                    (
                        (
                            Number(
                                view.views
                            ) -
                            min
                        ) /
                        range
                    ) *
                    (
                        height -
                        paddingY * 2
                    );

                return {
                    x,
                    y,
                    view
                };

            }
        );

    const line =
        points
            .map(
                (point,index) =>
                    `${
                        index === 0
                        ? "M"
                        : "L"
                    }
                    ${point.x}
                    ${point.y}`
            )
            .join(" ");

    const area =
        `
        M
        ${points[0].x}
        ${height-paddingY}

        L
        ${points
            .map(
                point =>
                    `${point.x} ${point.y}`
            )
            .join(" L ")}

        L
        ${points[points.length-1].x}
        ${height-paddingY}

        Z
        `;

    return `

        <div class="chart-card">

            <svg
                class="archive-chart"
                viewBox="
                    0 0
                    ${width}
                    ${height}
                "
                preserveAspectRatio="none"
            >

                <path
                    class="chart-area"
                    d="${area}"
                />

                <path
                    class="chart-line"
                    d="${line}"
                />

                ${points.map(point => `

                    <circle
                        class="chart-point"
                        cx="${point.x}"
                        cy="${point.y}"
                        r="5"
                        tabindex="0"
                        onclick="
                            openView(
                                '${escapeHTML(
                                    point.view.id
                                )}'
                            )
                        "
                    />

                `).join("")}

            </svg>

        </div>

    `;

}

/* =========================================================

   ========================================================= */

function renderStatisticsChart(){

    const activities =
        statisticsActivities();

    if(!activities.length){

        return `

            <div class="chart-empty">

                Adicione atividades para
                gerar estatísticas.

            </div>

        `;

    }

    const width = 760;
    const height = 270;

    const paddingX = 36;
    const paddingY = 30;

    const memberKeys = [
        "YUNAH",
        "MINJU",
        "MOKA",
        "WONHEE",
        "IROHA"
    ];

    const grouped =
        memberKeys.map(
            member => ({
                member,
                values:
                    activities.filter(
                        activity =>
                            activity.member ===
                            member
                    )
            })
        );

    const days = [];

    activities.forEach(
        activity => {

            if(
                !days.includes(
                    activity.date
                )
            ){

                days.push(
                    activity.date
                );

            }

        }
    );

    days.sort();

    const maxValue =
        Math.max(
            ...grouped.map(
                group =>
                    Math.max(
                        ...days.map(
                            date =>
                                group.values.filter(
                                    activity =>
                                        activity.date ===
                                        date
                                ).length
                        ),
                        0
                    )
            ),
            1
        );

    const makePoints =
        group => {

            return days.map(
                (date,index) => {

                    const value =
                        group.values.filter(
                            activity =>
                                activity.date ===
                                date
                        ).length;

                    const x =
                        paddingX +
                        (
                            index /
                            Math.max(
                                days.length - 1,
                                1
                            )
                        ) *
                        (
                            width -
                            paddingX * 2
                        );

                    const y =
                        height -
                        paddingY -
                        (
                            value /
                            maxValue
                        ) *
                        (
                            height -
                            paddingY * 2
                        );

                    return {
                        x,
                        y,
                        value,
                        date
                    };

                }
            );

        };

    const lines =
        grouped
            .filter(
                group =>
                    group.values.length
            )
            .map(
                group => {

                    const points =
                        makePoints(
                            group
                        );

                    const path =
                        points
                            .map(
                                (
                                    point,
                                    index
                                ) =>
                                    `${
                                        index === 0
                                            ? "M"
                                            : "L"
                                    }
                                    ${point.x}
                                    ${point.y}`
                            )
                            .join(" ");

                    const color =
                        memberColor(
                            group.member
                        );

                    return `

                        <path
                            class="stats-line"
                            d="${path}"
                            style="
                                stroke:
                                ${escapeHTML(
                                    color
                                )};
                            "
                        />

                        ${points.map(
                            point => `

                                <circle
                                    class="stats-point"
                                    cx="${point.x}"
                                    cy="${point.y}"
                                    r="4"
                                    style="
                                        fill:
                                        ${escapeHTML(
                                            color
                                        )};
                                        stroke:
                                        ${escapeHTML(
                                            color
                                        )};
                                    "
                                />

                            `
                        ).join("")}

                    `;

                }
            )
            .join("");

    return `

        <div class="chart-card">

            <svg
                class="archive-chart"
                viewBox="
                    0 0
                    ${width}
                    ${height}
                "
                preserveAspectRatio="none"
            >

                <line
                    class="chart-grid"
                    x1="${paddingX}"
                    y1="${height-paddingY}"
                    x2="${width-paddingX}"
                    y2="${height-paddingY}"
                />

                <line
                    class="chart-grid"
                    x1="${paddingX}"
                    y1="${paddingY}"
                    x2="${paddingX}"
                    y2="${height-paddingY}"
                />

                ${lines}

            </svg>

        </div>

    `;

}

/* =========================================================
   MODAL GLOBAL
   ========================================================= */

function showModal(content){

    let modal =
        document.getElementById(
            "global-modal"
        );

    if(!modal){

        modal =
            document.createElement(
                "div"
            );

        modal.id =
            "global-modal";

        modal.className =
            "modal-overlay";

        document.body.appendChild(
            modal
        );

    }

    modal.innerHTML =
        content;

    requestAnimationFrame(
        () => {

            modal.classList.add(
                "visible"
            );

        }
    );

}

function closeModal(){

    const modal =
        document.getElementById(
            "global-modal"
        );

    if(!modal){

        return;

    }

    modal.classList.remove(
        "visible"
    );

    setTimeout(
        () => {

            modal.remove();

        },
        220
    );

}

        type:
            document.getElementById(
                "view-type"
            ).value,

        views:
            Number(
                getFormValue(
                    "view-views"
                )
            ) || 0

    };

    if(!item.title){

        alert(
            "Adicione um nome."
        );

        return;

    }

    if(!item.date){

        alert(
            "Adicione uma data."
        );

        return;

    }

    if(existing){

        Object.assign(
            existing,
            item
        );

    }else{

        DATA.views.push(
            item
        );

    }

    saveData();

    closeModal();

    renderCurrentPage();

}

/* =========================================================
   DELETE VIEW
   ========================================================= */

function deleteViewItem(
    id
){

    const index =
        DATA.views.findIndex(
            view =>
                view.id === id
        );

    if(index === -1){

        return;

    }

    if(
        !confirm(
            "Excluir esta medição?"
        )
    ){

        return;

    }

    DATA.views.splice(
        index,
        1
    );

    saveData();

    renderCurrentPage();

}

/* =========================================================
   TEMA
   ========================================================= */

function toggleTheme(){

    const current =
        DATA.settings?.theme ===
        "dark"
        ?
        "dark"
        :
        "light";

    const next =
        current === "dark"
        ?
        "light"
        :
        "dark";

    DATA.settings =
        DATA.settings ||
        {};

    DATA.settings.theme =
        next;

    saveData();

    applyTheme();

    renderCurrentPage();

}

function applyTheme(){

    const theme =
        DATA.settings?.theme ||
        "light";

    document.documentElement
        .setAttribute(
            "data-theme",
            theme
        );

}

            display:none;
        }

        .admin-tab{
            min-height:34px;
            padding:
                0
                12px;
            border:0;
            border-radius:12px;
            background:
                rgba(255,255,255,.7);
            color:#777780;
            font-size:10px;
            font-weight:800;
            white-space:nowrap;
            cursor:pointer;
        }

        .admin-tab.active{
            background:#111114;
            color:#fff;
        }

        .admin-member-list,
        .settings-list,
        .admin-record-list{
            display:flex;
            flex-direction:column;
            gap:7px;
        }

        .admin-list-row,
        .settings-row{
            width:100%;
            display:flex;
            align-items:center;
            gap:11px;
            padding:11px;
            border:0;
            border-radius:18px;
            background:
                rgba(255,255,255,.7);
            text-align:left;
            cursor:pointer;
        }

        .admin-avatar{
            width:40px;
            height:40px;
            display:grid;
            place-items:center;
            border:
                2px solid;
            border-radius:14px;
            background:#fff;
            font-size:18px;
        }

        .admin-list-main,
        .settings-main{
            flex:1;
            min-width:0;
        }

        .admin-list-main strong,
        .settings-main strong{
            display:block;
            font-size:12px;
        }

        .admin-list-main small,
        .settings-main small{
            display:block;
            margin-top:3px;
            color:#8a8a91;
            font-size:10px;
        }

        .admin-profile-preview{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
        }

        .admin-profile-preview strong{
            display:block;
            font-size:15px;
        }

        .admin-profile-preview span{
            display:block;
            margin-top:4px;
            color:#8a8a91;
            font-size:10px;
        }

        .admin-mini-stat{
            text-align:right;
            font-size:20px;
            font-weight:900;
        }

        .admin-mini-stat span{
            font-size:9px;
        }

        .admin-record-row{
            display:flex;
            align-items:center;
            gap:9px;
            min-height:56px;
            padding:
                7px
                9px;
            border-radius:17px;
            background:
                rgba(255,255,255,.72);
        }

        .admin-record-date{
            width:42px;
            text-align:center;
            color:#888890;
            font-size:9px;
            font-weight:850;
        }

        .admin-record-main{
            flex:1;
            min-width:0;
        }

        .admin-record-main strong{
            display:block;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            font-size:11px;
        }

        .admin-record-main small{
            display:block;
            margin-top:3px;
            color:#898991;
            font-size:9px;
        }

        .icon-btn{
            width:32px;
            height:32px;
            border:0;
            border-radius:10px;
            background:#f0f0f2;
            color:#66666e;
            font-size:13px;
            cursor:pointer;
        }

        .icon-btn.danger{
            color:#e5484d;
        }

        .album-mini-icon{
            width:35px;
            height:35px;
            display:grid;
            place-items:center;
            border-radius:12px;
            background:#f1f1f3;
        }

        .admin-filter-row{
            display:flex;
            gap:7px;
            margin-bottom:10px;
        }

        .filter-chip{
            min-height:31px;
            padding:
                0
                11px;
            border:0;
            border-radius:11px;
            background:
                rgba(255,255,255,.7);
            color:#777780;
            font-size:10px;
            font-weight:800;
            cursor:pointer;
        }

        .filter-chip.active{
            background:#111114;
            color:#fff;
        }

        .admin-stat-grid{
            display:grid;
            grid-template-columns:
                repeat(2,1fr);
            gap:8px;
            margin-top:14px;
        }

        .admin-stat-grid > div{
            padding:12px;
            border-radius:15px;
            background:
                rgba(240,240,243,.7);
        }

        .admin-stat-grid strong{
            display:block;
            font-size:20px;
        }

        .admin-stat-grid span{
            display:block;
            margin-top:3px;
            color:#888890;
            font-size:9px;
        }

        .settings-icon{
            width:38px;
            height:38px;
            display:grid;
            place-items:center;
            flex:0 0 38px;
            border-radius:13px;
            background:#f0f0f3;
            font-size:16px;
        }

        .settings-admin{
            background:#111114;
            color:#fff;
        }

        .about-card{
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
            padding:25px;
        }

        .about-logo{
            width:60px;
            height:60px;
            display:grid;
            place-items:center;
            margin-bottom:10px;
            border-radius:18px;
            background:#111114;
            color:#fff;
            font-size:13px;
            font-weight:900;
        }

        .about-card strong{
            font-size:14px;
        }

        .about-card span,
        .about-card small{
            margin-top:4px;
            color:#8a8a91;
            font-size:10px;
        }

        [data-theme="dark"] body{
            background:
                radial-gradient(
                    circle at top,
                    #29292f,
                    #101013 65%
                );
            color:#f5f5f7;
        }

        [data-theme="dark"] .glass-card,
        [data-theme="dark"] .row-card,
        [data-theme="dark"] .album-card,
        [data-theme="dark"] .admin-record-row,
        [data-theme="dark"] .admin-list-row,
        [data-theme="dark"] .settings-row{
            background:
                rgba(38,38,43,.78);
            border-color:
                rgba(255,255,255,.08);
        }

        [data-theme="dark"] .modal-card{
            background:
                rgba(31,31,35,.98);
        }

        [data-theme="dark"] .modal-close,
        [data-theme="dark"] .form-input,
        [data-theme="dark"] .form-textarea{
            background:#444449;
            color:#fff;
        }

        [data-theme="dark"] .tab.active,
        [data-theme="dark"] .segment.active{
            background:#55555b;
            color:#fff;
        }

        [data-theme="dark"] .secondary-btn{
            background:#3e3e43;
            color:#fff;
            border-color:
                rgba(255,255,255,.08);
        }

        [data-theme="dark"] .empty-title{
            color:#fff;
        }

        @media(min-width:760px){

            .content{
                width:
                    min(
                        calc(100% - 48px),
                        900px
                    );
            }

            .page-header{
                width:
                    min(
                        calc(100% - 48px),
                        900px
                    );
                margin:0 auto;
                padding-top:42px;
            }

            .stats-summary-grid{
                grid-template-columns:
                    repeat(4,1fr);
            }

            .admin-stat-grid{
                grid-template-columns:
                    repeat(4,1fr);
            }

        }

    `;

    document.head.appendChild(
        style
    );

}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

function initArchive(){

    injectExtraStyles();

    applyTheme();

    startTimers();

    renderCurrentPage();

}

document.addEventListener(
    "DOMContentLoaded",
    initArchive
);

</script>

</head>
