<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ILLIT Archive</title>

<style>

/* ================================
   ILLIT ARCHIVE — BASE
================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  background: #e9e9ee;
  color: #17171a;
  min-height: 100vh;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ================================
   APP
================================ */

.app {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  background: #f7f7fa;
  position: relative;
  overflow-x: hidden;
}

/* ================================
   TOP HEADER
================================ */

.top-header {
  position: sticky;
  top: 0;
  z-index: 100;

  height: 58px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  background: rgba(247, 247, 250, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}

.header-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.4px;
}

.header-button {
  width: 34px;
  height: 34px;

  border-radius: 50%;

  background: #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 17px;

  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.06);
}

/* ================================
   PAGES
================================ */

.page {
  display: none;
  padding: 20px 16px 105px;
  min-height: calc(100vh - 58px);
}

.page.active {
  display: block;
}

/* ================================
   PAGE HEADING
================================ */

.page-heading {
  margin-bottom: 22px;
}

.page-heading h1 {
  font-size: 31px;
  line-height: 1.05;
  font-weight: 750;
  letter-spacing: -1.2px;
}

.page-heading p {
  margin-top: 6px;

  font-size: 14px;
  color: #8a8a91;
}

/* ================================
   IOS CARD
================================ */

.ios-card {
  background: #ffffff;
  border-radius: 22px;

  box-shadow:
    0 4px 18px rgba(0, 0, 0, 0.055);

  overflow: hidden;
}

/* ================================
   HOME
================================ */

.home-hero {
  position: relative;
  height: 270px;

  border-radius: 26px;
  overflow: hidden;

  background:
    linear-gradient(
      145deg,
      #f8d8e9,
      #dcefff,
      #fff4c9
    );
}

.home-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.home-hero-overlay {
  position: absolute;
  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;

  padding: 22px;

  background:
    linear-gradient(
      transparent 35%,
      rgba(0, 0, 0, 0.38)
    );
}

.home-hero-title {
  color: white;
  font-size: 29px;
  font-weight: 750;
  letter-spacing: -1px;
}

.home-hero-subtitle {
  margin-top: 5px;
  color: rgba(255,255,255,0.9);
  font-size: 14px;
}

/* ================================
   QUICK GRID
================================ */

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;

  margin-top: 16px;
}

.quick-card {
  min-height: 100px;

  padding: 16px;

  border-radius: 21px;

  background: #ffffff;

  box-shadow:
    0 4px 16px rgba(0,0,0,0.045);

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  transition: transform .18s ease;
}

.quick-card:active {
  transform: scale(.97);
}

.quick-card-icon {
  font-size: 24px;
}

.quick-card-title {
  font-size: 16px;
  font-weight: 700;
}

.quick-card-subtitle {
  margin-top: 3px;

  font-size: 12px;
  color: #92929a;
}

/* ================================
   MEMBER NAME COLORS
================================ */

.name-yunah {
  color: #ff5a67;
}

.name-minju {
  color: #d8ad00;
}

.name-moka {
  color: #9a78d6;
}

.name-wonhee {
  color: #ff78ad;
}

.name-iroha {
  color: #55bddd;
}

/* ================================
   BOTTOM NAV
================================ */

.bottom-nav {
  position: fixed;

  bottom: 0;
  left: 50%;

  width: 100%;
  max-width: 430px;

  transform: translateX(-50%);

  height: 78px;

  padding:
    8px 10px
    calc(8px + env(safe-area-inset-bottom));

  z-index: 200;

  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;

  background: rgba(248,248,251,0.94);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  border-top: 1px solid rgba(0,0,0,.06);
}

.nav-button {
  background: transparent;

  border-radius: 15px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  color: #8b8b93;

  font-size: 10px;
  font-weight: 600;
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
}

.nav-button.active {
  color: #17171a;
}

/* ================================
   FLOATING ADD BUTTON
================================ */

.floating-add {
  position: fixed;

  right: max(
    calc((100vw - 430px) / 2 + 18px),
    18px
  );

  bottom: 92px;

  width: 54px;
  height: 54px;

  border-radius: 50%;

  background: #17171a;
  color: #ffffff;

  font-size: 27px;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 8px 22px rgba(0,0,0,.18);

  z-index: 180;
}

.floating-add:active {
  transform: scale(.94);
}

/* ================================
   MODAL
================================ */

.modal-backdrop {
  position: fixed;
  inset: 0;

  z-index: 500;

  display: none;
  align-items: flex-end;
  justify-content: center;

  background: rgba(0,0,0,.28);

  backdrop-filter: blur(5px);
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 430px;

  max-height: 90vh;

  overflow-y: auto;

  background: #f7f7fa;

  border-radius: 28px 28px 0 0;

  padding: 20px 17px
    calc(24px + env(safe-area-inset-bottom));

  animation: modalUp .25s ease;
}

@keyframes modalUp {
  from {
    transform: translateY(100%);
  }

  to {
    transform: translateY(0);
  }
}

.modal-handle {
  width: 38px;
  height: 5px;

  border-radius: 99px;

  background: #d0d0d5;

  margin: 0 auto 20px;
}

.modal-title {
  font-size: 22px;
  font-weight: 750;

  margin-bottom: 18px;
}

/* ================================
   FORM
================================ */

.form-group {
  margin-bottom: 14px;
}

.form-label {
  display: block;

  margin-bottom: 6px;

  font-size: 12px;
  font-weight: 650;

  color: #77777f;
}

.form-input,
.form-textarea,
.form-select {
  width: 100%;

  border: 1px solid #e0e0e5;

  background: #ffffff;

  border-radius: 14px;

  padding: 12px 13px;

  outline: none;

  color: #17171a;
}

.form-textarea {
  min-height: 90px;
  resize: vertical;
}

.form-input:focus,
.form-textarea:focus,
.form-select:focus {
  border-color: #bdbdc5;
}

/* ================================
   MODAL BUTTONS
================================ */

.modal-actions {
  display: flex;
  gap: 10px;

  margin-top: 20px;
}

.button {
  flex: 1;

  min-height: 46px;

  border-radius: 15px;

  font-weight: 700;
}

.button-primary {
  background: #17171a;
  color: #ffffff;
}

.button-secondary {
  background: #e9e9ee;
  color: #17171a;
}

/* ================================
   TOAST
================================ */

.toast {
  position: fixed;

  left: 50%;
  bottom: 92px;

  transform:
    translate(-50%, 20px);

  z-index: 900;

  padding: 11px 17px;

  border-radius: 99px;

  background: rgba(30,30,34,.94);
  color: #ffffff;

  font-size: 13px;

  opacity: 0;
  pointer-events: none;

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}

/* ================================
   RESPONSIVE
================================ */

@media (min-width: 431px) {

  body {
    padding: 20px 0;
  }

  .app {
    min-height: calc(100vh - 40px);

    border-radius: 30px;

    box-shadow:
      0 12px 45px rgba(0,0,0,.08);

    overflow: hidden;
  }

  .bottom-nav {
    bottom: 20px;

    border-radius: 0 0 30px 30px;
  }
}

</style>
</head>

<body>

<script>

/* =================================
   GLOBAL
================================= */

const MEMBER_COLORS = {

  YUNAH: "#ff5a67",

  MINJU: "#ffd84d",

  MOKA: "#b99bea",

  WONHEE: "#ff9bc5",

  IROHA: "#8ddcf5"

};


/* =================================
   PAGE NAVIGATION
================================= */

function showPage(pageName) {

  document
    .querySelectorAll(".page")
    .forEach(page => {
      page.classList.remove("active");
    });


  const target =
    document.getElementById(
      "page-" + pageName
    );


  if (target) {
    target.classList.add("active");
  }


  document
    .querySelectorAll(".nav-button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === pageName
      );

    });


  const titles = {

    home: "ILLIT Archive",

    profile: "Profile",

    calendar: "Calendar",

    activities: "Activities",

    status: "Status"

  };


  document.getElementById(
    "headerTitle"
  ).textContent =
    titles[pageName] || "ILLIT Archive";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  updateFloatingButton(pageName);
}


/* =================================
   FLOATING BUTTON
================================= */

function updateFloatingButton(pageName) {

  const button =
    document.getElementById(
      "floatingAdd"
    );


  if (
    pageName === "calendar" ||
    pageName === "activities"
  ) {

    button.style.display = "flex";

  } else {

    button.style.display = "none";

  }

}


function handleFloatingAdd() {

  const active =
    document.querySelector(
      ".page.active"
    );


  if (!active) return;


  if (
    active.id === "page-calendar"
  ) {

    if (typeof openCalendarEventModal === "function") {
      openCalendarEventModal();
    }

    return;
  }


  if (
    active.id === "page-activities"
  ) {

    if (typeof openActivityModal === "function") {
      openActivityModal();
    }

  }

}


/* =================================
   MODAL
================================= */

function openModal(content) {

  const backdrop =
    document.getElementById(
      "modalBackdrop"
    );

  const modal =
    document.getElementById(
      "modalContent"
    );


  modal.innerHTML = content;

  backdrop.classList.add("show");

  document.body.style.overflow = "hidden";
}


function closeModal() {

  const backdrop =
    document.getElementById(
      "modalBackdrop"
    );

  backdrop.classList.remove("show");

  document.body.style.overflow = "";

}


function closeModalFromBackdrop(event) {

  if (
    event.target.id ===
    "modalBackdrop"
  ) {

    closeModal();

  }

}


/* =================================
   TOAST
================================= */

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent = message;

  toast.classList.add("show");


  setTimeout(() => {

    toast.classList.remove("show");

  }, 2200);

}


/* =================================
   SETTINGS
================================= */

function openSettings() {

  showToast(
    "Settings will be available here."
  );

}


/* =================================
   START
================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    showPage("home");

  }
);

</script>

const MEMBER_STORAGE =
  "illit_archive_members";


/* =================================
   GET MEMBERS
================================= */

function getMembers() {

  const saved =
    localStorage.getItem(
      MEMBER_STORAGE
    );

  if (!saved) {

    localStorage.setItem(
      MEMBER_STORAGE,
      JSON.stringify(DEFAULT_MEMBERS)
    );

    return DEFAULT_MEMBERS;

  }

  try {

    const parsed =
      JSON.parse(saved);

    if (
      Array.isArray(parsed) &&
      parsed.length === 5
    ) {

      return parsed;

    }

  } catch (error) {

    console.log(error);

  }

  return DEFAULT_MEMBERS;

}


/* =================================
   SAVE MEMBERS
================================= */

function saveMembers(members) {

  localStorage.setItem(
    MEMBER_STORAGE,
    JSON.stringify(members)
  );

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(value) {

  if (value === undefined ||
      value === null) {

    return "";

  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =================================
   MEMBER NAME CLASS
================================= */

function getMemberNameClass(
  stageName
) {

  const map = {

    YUNAH: "name-yunah",

    MINJU: "name-minju",

    MOKA: "name-moka",

    WONHEE: "name-wonhee",

    IROHA: "name-iroha"

  };

  return map[stageName] || "";

}


/* =================================
   PHOTO
================================= */

function memberPhotoHTML(member) {

  if (member.photo) {

    return `
      <img
        class="member-photo"
        src="${member.photo}"
        alt="${escapeHTML(member.stageName)}"
      >
    `;

  }

  return `
    <div
      class="member-photo"
      style="
        background:
          linear-gradient(
            145deg,
            ${member.color}55,
            #ffffff
          );
      "
    ></div>
  `;

}


/* =================================
   PROFILE FACT
================================= */

function profileFact(
  label,
  value
) {

  return `
    <div class="profile-fact">

      <div class="profile-fact-label">
        ${escapeHTML(label)}
      </div>

      <div class="profile-fact-value">
        ${escapeHTML(value || "—")}
      </div>

    </div>
  `;

}

/* =================================
   RENDER PROFILE
================================= */

function renderProfileCards() {

  const container =
    document.getElementById(
      "memberCardsGrid"
    );

  if (!container) return;

  const members =
    getMembers();

  container.innerHTML =
    members
      .map(createMemberCard)
      .join("");

}


/* =================================
   FLIP CARD
================================= */

function flipMemberCard(card) {

  card.classList.toggle(
    "flipped"
  );

}
