<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ILLIT Archive</title>

<style>

/* =========================
   ILLIT ARCHIVE
   iOS + IVECZECHDIVE STYLE
========================= */

:root {

  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --secondary: #8e8e93;
  --border: #e5e5ea;

  --yunah: #ff5a67;
  --minju: #ffd84d;
  --moka: #b99bea;
  --wonhee: #ff9bc5;
  --iroha: #8ddcf5;

  --radius: 24px;

}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Arial,
    sans-serif;

  background: var(--bg);
  color: var(--text);

  min-height: 100vh;

  padding-bottom: 90px;

}

button,
input,
textarea,
select {

  font-family: inherit;

}

button {

  border: none;
  cursor: pointer;

}

img {

  max-width: 100%;
  display: block;

}

/* =========================
   APP
========================= */

.app {

  width: 100%;
  max-width: 430px;

  min-height: 100vh;

  margin: 0 auto;

  background: var(--bg);

  position: relative;

}

/* =========================
   IOS HEADER
========================= */

.ios-header {

  position: sticky;
  top: 0;

  z-index: 50;

  background: rgba(242,242,247,0.92);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  padding:
    18px
    18px
    14px;

  border-bottom: 1px solid rgba(0,0,0,0.05);

}

.header-small {

  font-size: 13px;

  color: var(--secondary);

  margin-bottom: 3px;

}

.header-title {

  font-size: 30px;

  font-weight: 700;

  letter-spacing: -1px;

}

/* =========================
   PAGE
========================= */

.page {

  display: none;

  padding: 18px;

  animation: pageIn .25s ease;

}

.page.active {

  display: block;

}

@keyframes pageIn {

  from {

    opacity: 0;
    transform: translateY(5px);

  }

  to {

    opacity: 1;
    transform: translateY(0);

  }

}

/* =========================
   HOME / PROFILE INTRO
========================= */

.archive-intro {

  margin-bottom: 22px;

}

.archive-intro h1 {

  font-size: 34px;

  letter-spacing: -1.5px;

  margin-bottom: 6px;

}

.archive-intro p {

  color: var(--secondary);

  font-size: 15px;

  line-height: 1.5;

}

/* =========================
   SECTION TITLE
========================= */

.section-heading {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin:

    25px
    2px
    12px;

}

.section-heading h2 {

  font-size: 21px;

  letter-spacing: -0.5px;

}

.section-heading span {

  color: var(--secondary);

  font-size: 13px;

}

/* =========================
   IOS CARD
========================= */

.ios-card {

  background: var(--card);

  border-radius: var(--radius);

  border: 1px solid rgba(0,0,0,0.035);

  box-shadow:
    0 4px 18px rgba(0,0,0,0.035);

}

/* =========================
   PROFILE CARDS
========================= */

.members-grid {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;

}

/* last member */

.member-card:last-child {

  grid-column: span 2;

}

/* =========================
   MEMBER CARD
========================= */

.member-card {

  position: relative;

  overflow: hidden;

  min-height: 260px;

  border-radius: 25px;

  background: #fff;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.055);

  border: 1px solid rgba(0,0,0,0.035);

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.member-card:active {

  transform: scale(.97);

}

.member-photo {

  width: 100%;

  height: 195px;

  object-fit: cover;

  background: #eeeeef;

}

.member-photo-placeholder {

  width: 100%;

  height: 195px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 42px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f2f2f7
    );

}

.member-info {

  padding: 12px 13px 14px;

}

.member-name {

  font-size: 17px;

  font-weight: 700;

  margin-bottom: 3px;

}

.member-korean {

  font-size: 12px;

  color: var(--secondary);

}

.member-color-line {

  width: 32px;

  height: 4px;

  border-radius: 10px;

  margin-top: 9px;

}

/* member colors */

.member-card.yunah .member-color-line {
  background: var(--yunah);
}

.member-card.minju .member-color-line {
  background: var(--minju);
}

.member-card.moka .member-color-line {
  background: var(--moka);
}

.member-card.wonhee .member-color-line {
  background: var(--wonhee);
}

.member-card.iroha .member-color-line {
  background: var(--iroha);
}

/* =========================
   VIEW PROFILE
========================= */

.view-profile {

  display: flex;

  align-items: center;

  justify-content: space-between;

  width: 100%;

  margin-top: 11px;

  padding-top: 10px;

  border-top: 1px solid var(--border);

  background: transparent;

  color: var(--text);

  font-size: 13px;

  font-weight: 600;

}

.view-profile span {

  color: var(--secondary);

  font-size: 18px;

}

/* =========================
   QUICK CARDS
========================= */

.quick-grid {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;

}

.quick-card {

  min-height: 120px;

  padding: 17px;

  border-radius: 22px;

  background: #fff;

  box-shadow:
    0 4px 16px rgba(0,0,0,0.04);

  border: 1px solid rgba(0,0,0,0.035);

  text-align: left;

}

.quick-icon {

  font-size: 25px;

  margin-bottom: 12px;

}

.quick-title {

  font-size: 16px;

  font-weight: 700;

  margin-bottom: 3px;

}

.quick-text {

  font-size: 12px;

  color: var(--secondary);

}

/* =========================
   IOS BOTTOM NAV
========================= */

.bottom-nav {

  position: fixed;

  z-index: 100;

  bottom: 0;

  left: 50%;

  transform: translateX(-50%);

  width: 100%;

  max-width: 430px;

  height: 76px;

  padding:
    8px
    8px
    12px;

  background:
    rgba(255,255,255,0.92);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  border-top:
    1px solid rgba(0,0,0,0.08);

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

}

.nav-button {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 3px;

  background: transparent;

  color: var(--secondary);

  font-size: 10px;

  font-weight: 500;

}

.nav-button .nav-icon {

  font-size: 21px;

  line-height: 1;

}

.nav-button.active {

  color: var(--text);

  font-weight: 700;

}

/* =========================
   PROFILE DETAIL
========================= */

.profile-detail {

  display: none;

}

.profile-detail.active {

  display: block;

}

.profile-cover {

  border-radius: 28px;

  overflow: hidden;

  background: #fff;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.05);

}

.profile-cover img {

  width: 100%;

  height: 340px;

  object-fit: cover;

}

.profile-cover-placeholder {

  height: 340px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 60px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #eeeeef
    );

}

.profile-content {

  padding: 20px;

}

.profile-name {

  font-size: 32px;

  font-weight: 750;

  letter-spacing: -1px;

}

.profile-korean {

  color: var(--secondary);

  margin-top: 3px;

}

.profile-accent {

  width: 50px;

  height: 5px;

  border-radius: 10px;

  margin: 14px 0 18px;

}

.profile-description {

  font-size: 15px;

  line-height: 1.6;

  color: #48484a;

}

.profile-fields {

  margin-top: 20px;

  display: flex;

  flex-direction: column;

  gap: 1px;

  overflow: hidden;

  border-radius: 18px;

  background: var(--border);

}

.profile-field {

  background: #fff;

  padding: 14px 15px;

}

.field-label {

  font-size: 11px;

  color: var(--secondary);

  margin-bottom: 4px;

}

.field-value {

  font-size: 15px;

}

/* =========================
   RESPONSIVE
========================= */

@media (min-width: 431px) {

  body {

    padding-bottom: 0;

  }

  .bottom-nav {

    border-radius: 20px 20px 0 0;

  }

}

</style>

</head>

<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header class="ios-header">

  <div class="header-small">
    ILLIT Archive
  </div>

  <div class="header-title" id="pageTitle">
    Home
  </div>

</header>


<!-- =========================
     HOME
========================= -->

<main
  class="page active"
  id="homePage"
>

  <div class="archive-intro">

    <h1>
      ILLIT Archive
    </h1>

    <p>
      tracking activities, schedules & profiles
    </p>

  </div>


  <div class="section-heading">

    <h2>
      Members
    </h2>

    <span>
      5 members
    </span>

  </div>


  <div
    class="members-grid"
    id="membersGrid"
  >

    <!-- MEMBERS WILL BE GENERATED HERE -->

  </div>


  <div class="section-heading">

    <h2>
      Archive
    </h2>

  </div>


  <div class="quick-grid">

    <button
      class="quick-card"
      onclick="showPage('calendar')"
    >

      <div class="quick-icon">
        📅
      </div>

      <div class="quick-title">
        Calendar
      </div>

      <div class="quick-text">
        activities by date
      </div>

    </button>


    <button
      class="quick-card"
      onclick="showPage('schedule')"
    >

      <div class="quick-icon">
        🗓️
      </div>

      <div class="quick-title">
        Schedule
      </div>

      <div class="quick-text">
        upcoming activities
      </div>

    </button>


    <button
      class="quick-card"
      onclick="showPage('activities')"
    >

      <div class="quick-icon">
        📸
      </div>

      <div class="quick-title">
        Activities
      </div>

      <div class="quick-text">
        solo & group
      </div>

    </button>


    <button
      class="quick-card"
      onclick="showPage('stats')"
    >

      <div class="quick-icon">
        📊
      </div>

      <div class="quick-title">
        Statistics
      </div>

      <div class="quick-text">
        member activity
      </div>

    </button>

  </div>

</main>


<!-- =========================
     PROFILE PAGE
========================= -->

<section
  class="page"
  id="profilePage"
>

  <div
    id="profileList"
  ></div>

</section>


<!-- =========================
     PROFILE DETAIL PAGE
========================= -->

<section
  class="page"
  id="profileDetailPage"
>

  <button
    onclick="showPage('profile')"
    style="
      background:none;
      color:#8e8e93;
      font-size:15px;
      margin-bottom:15px;
    "
  >
    ‹ members
  </button>

  <div
    id="profileDetail"
    class="profile-detail"
  ></div>

</section>


<!-- =========================
     CALENDAR
========================= -->

<section
  class="page"
  id="calendarPage"
>

  <div id="calendarContainer"></div>

</section>


<!-- =========================
     SCHEDULE
========================= -->

<section
  class="page"
  id="schedulePage"
>

  <div id="scheduleContainer"></div>

</section>


<!-- =========================
     ACTIVITIES
========================= -->

<section
  class="page"
  id="activitiesPage"
>

  <div id="activitiesContainer"></div>

</section>


<!-- =========================
     STATISTICS
========================= -->

<section
  class="page"
  id="statsPage"
>

  <div id="statsContainer"></div>

</section>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

  <button
    class="nav-button active"
    data-page="home"
    onclick="showPage('home')"
  >

    <span class="nav-icon">
      ⌂
    </span>

    Home

  </button>


  <button
    class="nav-button"
    data-page="calendar"
    onclick="showPage('calendar')"
  >

    <span class="nav-icon">
      ◫
    </span>

    Calendar

  </button>


  <button
    class="nav-button"
    data-page="activities"
    onclick="showPage('activities')"
  >

    <span class="nav-icon">
      ◉
    </span>

    Activities

  </button>


  <button
    class="nav-button"
    data-page="stats"
    onclick="showPage('stats')"
  >

    <span class="nav-icon">
      ◌
    </span>

    Stats

  </button>

</nav>

</div>


<script>

/* ==========================================
   ILLIT ARCHIVE — DATA
========================================== */

const memberDefaults = {

  yunah: {
    id: "yunah",
    name: "YUNAH",
    korean: "윤아",
    emoji: "🐆",
    color: "#ff5a67",
    photo: "",
    description: "",
    fields: [
      { label: "name", value: "" },
      { label: "birthday", value: "" },
      { label: "birthplace", value: "" }
    ]
  },

  minju: {
    id: "minju",
    name: "MINJU",
    korean: "민주",
    emoji: "🐰",
    color: "#ffd84d",
    photo: "",
    description: "",
    fields: [
      { label: "name", value: "" },
      { label: "birthday", value: "" },
      { label: "birthplace", value: "" }
    ]
  },

  moka: {
    id: "moka",
    name: "MOKA",
    korean: "모카",
    emoji: "☕️",
    color: "#b99bea",
    photo: "",
    description: "",
    fields: [
      { label: "name", value: "" },
      { label: "birthday", value: "" },
      { label: "birthplace", value: "" }
    ]
  },

  wonhee: {
    id: "wonhee",
    name: "WONHEE",
    korean: "원희",
    emoji: "🐿",
    color: "#ff9bc5",
    photo: "",
    description: "",
    fields: [
      { label: "name", value: "" },
      { label: "birthday", value: "" },
      { label: "birthplace", value: "" }
    ]
  },

  iroha: {
    id: "iroha",
    name: "IROHA",
    korean: "이로하",
    emoji: "🐢",
    color: "#8ddcf5",
    photo: "",
    description: "",
    fields: [
      { label: "name", value: "" },
      { label: "birthday", value: "" },
      { label: "birthplace", value: "" }
    ]
  }

};


/* ==========================================
   STORAGE
========================================== */

function getMembers() {

  const saved =
    localStorage.getItem("illit_archive_members");

  if (!saved) {

    localStorage.setItem(
      "illit_archive_members",
      JSON.stringify(memberDefaults)
    );

    return JSON.parse(
      JSON.stringify(memberDefaults)
    );

  }

  return JSON.parse(saved);

}


function saveMembers(members) {

  localStorage.setItem(
    "illit_archive_members",
    JSON.stringify(members)
  );

}


/* ==========================================
   PAGE NAVIGATION
========================================== */

function showPage(page) {

  const pages = {

    home: "homePage",
    profile: "profilePage",
    calendar: "calendarPage",
    schedule: "schedulePage",
    activities: "activitiesPage",
    stats: "statsPage"

  };


  Object.values(pages).forEach(id => {

    const element =
      document.getElementById(id);

    if (element) {

      element.classList.remove("active");

    }

  });


  const selected =
    document.getElementById(
      pages[page]
    );


  if (selected) {

    selected.classList.add("active");

  }


  const titles = {

    home: "Home",
    profile: "Profile",
    calendar: "Calendar",
    schedule: "Schedule",
    activities: "Activities",
    stats: "Statistics"

  };


  document.getElementById(
    "pageTitle"
  ).textContent =
    titles[page] || "ILLIT Archive";


  document
    .querySelectorAll(".nav-button")
    .forEach(button => {

      button.classList.remove("active");

    });


  const nav =
    document.querySelector(
      `.nav-button[data-page="${page}"]`
    );


  if (nav) {

    nav.classList.add("active");

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  if (page === "profile") {

    renderProfileList();

  }


  if (page === "calendar") {

    if (typeof renderCalendar === "function") {

      renderCalendar();

    }

  }


  if (page === "schedule") {

    if (typeof renderSchedule === "function") {

      renderSchedule();

    }

  }


  if (page === "activities") {

    if (typeof renderActivities === "function") {

      renderActivities();

    }

  }


  if (page === "stats") {

    if (typeof renderStats === "function") {

      renderStats();

    }

  }

}


/* ==========================================
   MEMBER CARD
========================================== */

function createMemberCard(member) {

  const card =
    document.createElement("div");

  card.className =
    `member-card ${member.id}`;

  let imageHTML = "";

  if (member.photo) {

    imageHTML = `
      <img
        class="member-photo"
        src="${member.photo}"
        alt="${member.name}"
      >
    `;

  } else {

    imageHTML = `
      <div
        class="member-photo-placeholder"
        style="
          border-bottom: 4px solid ${member.color};
        "
      >
        ${member.emoji}
      </div>
    `;

  }


  card.innerHTML = `

    ${imageHTML}

    <div class="member-info">

      <div class="member-name">
        ${member.name}
      </div>

      <div class="member-korean">
        ${member.korean}
      </div>

      <div
        class="member-color-line"
        style="background:${member.color}"
      ></div>

      <button
        class="view-profile"
        onclick="openMemberProfile('${member.id}')"
      >

        <span>
          view profile
        </span>

        <span>
          ›
        </span>

      </button>

    </div>

  `;


  return card;

}


/* ==========================================
   HOME MEMBERS
========================================== */

function renderHomeMembers() {

  const container =
    document.getElementById(
      "membersGrid"
    );

  if (!container) return;

  container.innerHTML = "";


  const members =
    getMembers();


  Object.values(members)
    .forEach(member => {

      container.appendChild(
        createMemberCard(member)
      );

    });

}


/* ==========================================
   PROFILE LIST
========================================== */

function renderProfileList() {

  const container =
    document.getElementById(
      "profileList"
    );

  if (!container) return;

  container.innerHTML = `

    <div class="archive-intro">

      <h1>
        Members
      </h1>

      <p>
        ILLIT member profiles
      </p>

    </div>

    <div
      class="members-grid"
      id="profileMembersGrid"
    ></div>

  `;


  const grid =
    document.getElementById(
      "profileMembersGrid"
    );


  const members =
    getMembers();


  Object.values(members)
    .forEach(member => {

      grid.appendChild(
        createMemberCard(member)
      );

    });

}


/* ==========================================
   OPEN MEMBER PROFILE
========================================== */

function openMemberProfile(memberId) {

  const members =
    getMembers();

  const member =
    members[memberId];

  if (!member) return;


  showPage("profile-detail");


  const page =
    document.getElementById(
      "profileDetailPage"
    );


  const detail =
    document.getElementById(
      "profileDetail"
    );


  /*
    showPage uses the regular page system.
    We activate the detail page manually.
  */

  document
    .querySelectorAll(".page")
    .forEach(element => {

      element.classList.remove("active");

    });


  page.classList.add("active");


  document.getElementById(
    "pageTitle"
  ).textContent =
    member.name;


  document
    .querySelectorAll(".nav-button")
    .forEach(button => {

      button.classList.remove("active");

    });


  let fieldsHTML = "";


  if (
    member.fields &&
    member.fields.length
  ) {

    fieldsHTML = `

      <div class="profile-fields">

        ${member.fields.map(field => `

          <div class="profile-field">

            <div class="field-label">
              ${escapeHTML(field.label)}
            </div>

            <div class="field-value">
              ${escapeHTML(field.value)}
            </div>

          </div>

        `).join("")}

      </div>

    `;

  }


  let photoHTML = "";


  if (member.photo) {

    photoHTML = `

      <img
        src="${member.photo}"
        alt="${escapeHTML(member.name)}"
      >

    `;

  } else {

    photoHTML = `

      <div
        class="profile-cover-placeholder"
        style="
          border-bottom: 6px solid ${member.color};
        "
      >
        ${member.emoji}
      </div>

    `;

  }


  detail.innerHTML = `

    <div class="profile-cover">

      ${photoHTML}

      <div class="profile-content">

        <div
          class="profile-name"
          style="color:${member.color}"
        >
          ${escapeHTML(member.name)}
        </div>

        <div class="profile-korean">
          ${escapeHTML(member.korean)}
        </div>

        <div
          class="profile-accent"
          style="background:${member.color}"
        ></div>

        <div class="profile-description">

          ${
            member.description
              ? escapeHTML(member.description)
              : "no description yet."
          }

        </div>

        ${fieldsHTML}

      </div>

    </div>


    <button
      onclick="editMember('${member.id}')"
      style="
        width:100%;
        margin-top:14px;
        padding:16px;
        border-radius:18px;
        background:#ffffff;
        color:${member.color};
        font-size:15px;
        font-weight:700;
        box-shadow:0 4px 16px rgba(0,0,0,.04);
      "
    >
      ✏️ edit profile
    </button>

  `;


  detail.classList.add("active");

}


/* ==========================================
   HTML SAFETY
========================================== */

function escapeHTML(value) {

  if (value === undefined ||
      value === null) {

    return "";

  }


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ==========================================
   START
========================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    getMembers();

    renderHomeMembers();

  }
);

</script>

<script>

/* ==========================================
   PROFILE EDITOR STATE
========================================== */

let editingMemberId = null;

let editingMemberPhoto = "";


/* ==========================================
   OPEN EDITOR
========================================== */

function editMember(memberId) {

  const members =
    getMembers();

  const member =
    members[memberId];

  if (!member) return;


  editingMemberId =
    memberId;

  editingMemberPhoto =
    member.photo || "";


  document.getElementById(
    "profileEditorTitle"
  ).textContent =
    `edit ${member.name.toLowerCase()}`;


  document.getElementById(
    "editMemberName"
  ).value =
    member.name || "";


  document.getElementById(
    "editMemberKorean"
  ).value =
    member.korean || "";


  document.getElementById(
    "editMemberDescription"
  ).value =
    member.description || "";


  renderMemberPhotoPreview();

  renderMemberFieldsEditor();


  document
    .getElementById(
      "profileEditorModal"
    )
    .classList.add("active");

}


/* ==========================================
   CLOSE EDITOR
========================================== */

function closeProfileEditor() {

  document
    .getElementById(
      "profileEditorModal"
    )
    .classList.remove("active");

  editingMemberId = null;

  editingMemberPhoto = "";

}


/* ==========================================
   PHOTO PREVIEW
========================================== */

function renderMemberPhotoPreview() {

  const preview =
    document.getElementById(
      "memberPhotoPreview"
    );

  if (!preview) return;


  if (editingMemberPhoto) {

    preview.innerHTML = `

      <img
        src="${editingMemberPhoto}"
        alt="member photo"
      >

    `;

  } else {

    preview.innerHTML = `

      <div class="photo-empty">
        no photo
      </div>

    `;

  }

}


/* ==========================================
   UPLOAD PHOTO
========================================== */

function handleMemberPhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  /*
    Resize the image before saving.
    This makes localStorage much more practical
    on a phone.
  */

  const reader =
    new FileReader();


  reader.onload = function(e) {

    const img =
      new Image();


    img.onload = function() {

      const maxSize = 1000;

      let width =
        img.width;

      let height =
        img.height;


      if (width > maxSize ||
          height > maxSize) {

        if (width > height) {

          height =
            Math.round(
              height *
              maxSize /
              width
            );

          width =
            maxSize;

        } else {

          width =
            Math.round(
              width *
              maxSize /
              height
            );

          height =
            maxSize;

        }

      }


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      editingMemberPhoto =
        canvas.toDataURL(
          "image/jpeg",
          0.78
        );


      renderMemberPhotoPreview();

      showToast(
        "photo added"
      );

    };


    img.src =
      e.target.result;

  };


  reader.readAsDataURL(file);

}


/* ==========================================
   REMOVE PHOTO
========================================== */

function removeMemberPhoto() {

  editingMemberPhoto = "";

  renderMemberPhotoPreview();

  document.getElementById(
    "memberPhotoInput"
  ).value = "";

}


/* ==========================================
   RENDER FIELDS
========================================== */

function renderMemberFieldsEditor() {

  const container =
    document.getElementById(
      "memberFieldsEditor"
    );

  if (!container) return;


  const members =
    getMembers();

  const member =
    members[editingMemberId];


  if (!member) return;


  if (!member.fields) {

    member.fields = [];

  }


  container.innerHTML = "";


  member.fields.forEach(
    (field, index) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "field-editor-row";


      row.innerHTML = `

        <div class="field-editor-top">

          <input
            class="field-editor-input"
            data-field-label="${index}"
            value="${escapeHTML(field.label)}"
            placeholder="label"
          >

          <input
            class="field-editor-input"
            data-field-value="${index}"
            value="${escapeHTML(field.value)}"
            placeholder="value"
          >

          <button
            class="remove-field"
            onclick="removeMemberField(${index})"
          >
            ×
          </button>

        </div>

      `;


      container.appendChild(row);

    }
  );

}


/* ==========================================
   ADD FIELD
========================================== */

function addMemberField() {

  const members =
    getMembers();

  const member =
    members[editingMemberId];

  if (!member) return;


  if (!member.fields) {

    member.fields = [];

  }


  member.fields.push({

    label: "",

    value: ""

  });


  /*
    Save the temporary structure so the
    editor can keep newly added fields.
  */

  saveMembers(members);

  renderMemberFieldsEditor();

}


/* ==========================================
   REMOVE FIELD
========================================== */

function removeMemberField(index) {

  const members =
    getMembers();

  const member =
    members[editingMemberId];

  if (!member ||
      !member.fields) return;


  member.fields.splice(
    index,
    1
  );


  saveMembers(members);

  renderMemberFieldsEditor();

}


/* ==========================================
   SAVE PROFILE
========================================== */

function saveMemberProfile() {

  if (!editingMemberId) return;


  const members =
    getMembers();

  const member =
    members[editingMemberId];

  if (!member) return;


  /*
    Save fields currently visible
  */

  const labels =
    document.querySelectorAll(
      "[data-field-label]"
    );

  const values =
    document.querySelectorAll(
      "[data-field-value]"
    );


  const fields = [];


  labels.forEach(
    (labelInput, index) => {

      const valueInput =
        values[index];


      const label =
        labelInput.value.trim();

      const value =
        valueInput
          ? valueInput.value.trim()
          : "";


      if (label || value) {

        fields.push({

          label: label,

          value: value

        });

      }

    }
  );


  member.name =
    document.getElementById(
      "editMemberName"
    ).value.trim() ||
    member.name;


  member.korean =
    document.getElementById(
      "editMemberKorean"
    ).value.trim();


  member.description =
    document.getElementById(
      "editMemberDescription"
    ).value.trim();


  member.photo =
    editingMemberPhoto;


  member.fields =
    fields;


  saveMembers(members);


  closeProfileEditor();


  renderHomeMembers();

  renderProfileList();


  /*
    If the profile detail is currently open,
    refresh it too.
  */

  openMemberProfile(
    editingMemberId
  );


  showToast(
    "profile saved"
  );

}


/* ==========================================
   TOAST
========================================== */

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  if (!toast) return;


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.illitToastTimer
  );


  window.illitToastTimer =
    setTimeout(
      function() {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* ==========================================
   CLOSE MODAL WHEN TAPPING OUTSIDE
========================================== */

document.addEventListener(
  "click",
  function(event) {

    const modal =
      document.getElementById(
        "profileEditorModal"
      );

    if (
      event.target === modal
    ) {

      closeProfileEditor();

    }

  }
);

</script>

<script>

/* =========================================================
   ACTIVITY DATA
========================================================= */

const defaultActivityCategories = [
  "solo",
  "group",
  "appearance",
  "photoshoot",
  "other"
];


function getActivities(){

  try{

    return JSON.parse(
      localStorage.getItem("illitActivities")
    ) || [];

  }catch(error){

    return [];

  }

}


function saveActivities(activities){

  localStorage.setItem(
    "illitActivities",
    JSON.stringify(activities)
  );

}


function getFolders(){

  try{

    return JSON.parse(
      localStorage.getItem("illitFolders")
    ) || [];

  }catch(error){

    return [];

  }

}


function saveFolders(folders){

  localStorage.setItem(
    "illitFolders",
    JSON.stringify(folders)
  );

}



/* =========================================================
   MEMBER CATEGORIES
========================================================= */

function getMemberCategories(memberId){

  const members = getMembers();

  const member = members.find(
    item => item.id === memberId
  );

  if(
    member &&
    Array.isArray(member.categories) &&
    member.categories.length
  ){

    return member.categories.slice(0,5);

  }

  return defaultActivityCategories;

}



/* =========================================================
   ACTIVITY EDITOR STATE
========================================================= */

let editingActivityId = null;

let activityScope = "solo";

let selectedActivityMembers = [];

let selectedActivityCategory = "";

let activityPhotoData = "";



/* =========================================================
   OPEN ACTIVITY EDITOR
========================================================= */

function openActivityEditor(activityId = null){

  editingActivityId = activityId;

  activityPhotoData = "";

  selectedActivityMembers = [];

  selectedActivityCategory = "";

  activityScope = "solo";


  const modal =
    document.getElementById("activityEditorModal");

  const title =
    document.getElementById("activityModalTitle");


  if(activityId){

    const activities = getActivities();

    const activity = activities.find(
      item => item.id === activityId
    );

    if(!activity){

      return;

    }


    title.textContent = "edit activity";

    document.getElementById("activityTitle").value =
      activity.title || "";

    document.getElementById("activityDate").value =
      activity.date || "";

    document.getElementById("activityDescription").value =
      activity.description || "";

    document.getElementById("activityLink").value =
      activity.link || "";

    document.getElementById("activityAddress").value =
      activity.address || "";

    document.getElementById("activityFolder").value =
      activity.folder || "";


    activityScope =
      activity.scope || "solo";


    selectedActivityMembers =
      Array.isArray(activity.members)
        ? [...activity.members]
        : [];


    selectedActivityCategory =
      activity.category || "";


    activityPhotoData =
      activity.photo || "";

  }else{

    title.textContent = "add activity";

    document.getElementById("activityTitle").value = "";

    document.getElementById("activityDate").value = "";

    document.getElementById("activityDescription").value = "";

    document.getElementById("activityLink").value = "";

    document.getElementById("activityAddress").value = "";

    document.getElementById("activityFolder").value = "";

    activityScope = "solo";

    selectedActivityMembers = [];

    selectedActivityCategory = "";

    activityPhotoData = "";

  }


  renderActivityMemberSelector();

  renderActivityCategorySelector();

  renderActivityFolderSelector();

  renderActivityPhotoPreview();

  updateActivityScopeButtons();


  modal.classList.add("active");

  document.body.style.overflow = "hidden";

}



/* =========================================================
   CLOSE ACTIVITY EDITOR
========================================================= */

function closeActivityEditor(){

  document
    .getElementById("activityEditorModal")
    .classList.remove("active");

  document.body.style.overflow = "";

  editingActivityId = null;

}



/* =========================================================
   SCOPE
========================================================= */

function setActivityScope(scope){

  activityScope = scope;

  updateActivityScopeButtons();

}


function updateActivityScopeButtons(){

  const solo =
    document.getElementById("scopeSolo");

  const group =
    document.getElementById("scopeGroup");


  solo.classList.toggle(
    "selected",
    activityScope === "solo"
  );


  group.classList.toggle(
    "selected",
    activityScope === "group"
  );

}



/* =========================================================
   MEMBER SELECTOR
========================================================= */

function renderActivityMemberSelector(){

  const container =
    document.getElementById(
      "activityMemberSelector"
    );


  const members = getMembers();


  container.innerHTML = "";


  members.forEach(member => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className = "member-option";


    if(
      selectedActivityMembers.includes(
        member.id
      )
    ){

      button.classList.add("selected");

    }


    button.innerHTML = `

      <span
        class="member-option-name"
        style="color:${escapeHTML(member.color || "#111")}"
      >
        ${escapeHTML(member.name)}
      </span>

      <span class="member-option-korean">
        ${escapeHTML(member.korean || "")}
      </span>

    `;


    button.onclick = function(){

      toggleActivityMember(member.id);

    };


    container.appendChild(button);

  });

}


function toggleActivityMember(memberId){

  if(
    selectedActivityMembers.includes(memberId)
  ){

    selectedActivityMembers =
      selectedActivityMembers.filter(
        id => id !== memberId
      );

  }else{

    if(activityScope === "solo"){

      selectedActivityMembers = [
        memberId
      ];

    }else{

      selectedActivityMembers.push(
        memberId
      );

    }

  }


  renderActivityMemberSelector();

}



/* =========================================================
   CATEGORY SELECTOR
========================================================= */

function renderActivityCategorySelector(){

  const container =
    document.getElementById(
      "activityCategorySelector"
    );


  const members = getMembers();


  let categories = [];


  selectedActivityMembers.forEach(memberId => {

    getMemberCategories(memberId)
      .forEach(category => {

        if(
          category &&
          !categories.includes(category)
        ){

          categories.push(category);

        }

      });

  });


  if(!categories.length){

    categories =
      defaultActivityCategories;

  }


  container.innerHTML = "";


  categories
    .slice(0,5)
    .forEach(category => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "category-option";


      if(
        selectedActivityCategory === category
      ){

        button.classList.add("selected");

      }


      button.textContent =
        category;


      button.onclick = function(){

        selectedActivityCategory =
          category;

        renderActivityCategorySelector();

      };


      container.appendChild(button);

    });

}



/* =========================================================
   FOLDER SELECTOR
========================================================= */

function renderActivityFolderSelector(){

  const select =
    document.getElementById(
      "activityFolder"
    );


  const folders = getFolders();


  select.innerHTML =
    `<option value="">no folder</option>`;


  folders.forEach(folder => {

    const option =
      document.createElement("option");

    option.value =
      folder.id;

    option.textContent =
      folder.name;

    select.appendChild(option);

  });


  if(editingActivityId){

    const activities = getActivities();

    const activity = activities.find(
      item => item.id === editingActivityId
    );


    if(activity){

      select.value =
        activity.folder || "";

    }

  }

}



/* =========================================================
   ACTIVITY PHOTO
========================================================= */

function handleActivityPhoto(event){

  const file =
    event.target.files &&
    event.target.files[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(e){

    const img =
      new Image();


    img.onload = function(){

      const maxSize = 1000;

      let width =
        img.width;

      let height =
        img.height;


      if(width > maxSize || height > maxSize){

        if(width > height){

          height =
            Math.round(
              height * maxSize / width
            );

          width = maxSize;

        }else{

          width =
            Math.round(
              width * maxSize / height
            );

          height = maxSize;

        }

      }


      const canvas =
        document.createElement("canvas");

      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      activityPhotoData =
        canvas.toDataURL(
          "image/jpeg",
          0.78
        );


      renderActivityPhotoPreview();

    };


    img.src =
      e.target.result;

  };


  reader.readAsDataURL(file);

}


function renderActivityPhotoPreview(){

  const box =
    document.getElementById(
      "activityPhotoPreview"
    );


  if(activityPhotoData){

    box.innerHTML = `

      <img
        src="${activityPhotoData}"
        alt=""
      >

    `;

  }else{

    box.innerHTML = `

      <div class="photo-upload-placeholder">

        <span>📷</span>

        add photo

      </div>

    `;

  }

}



/* =========================================================
   SAVE ACTIVITY
========================================================= */

function saveActivity(){

  const title =
    document
      .getElementById("activityTitle")
      .value
      .trim();


  const date =
    document
      .getElementById("activityDate")
      .value;


  if(!title){

    showToast(
      "please add an activity title"
    );

    return;

  }


  if(!date){

    showToast(
      "please select a date"
    );

    return;

  }


  if(!selectedActivityMembers.length){

    showToast(
      "please select at least one member"
    );

    return;

  }


  if(!selectedActivityCategory){

    selectedActivityCategory =
      getMemberCategories(
        selectedActivityMembers[0]
      )[0] || "other";

  }


  const activities =
    getActivities();


  const folder =
    document
      .getElementById("activityFolder")
      .value;


  const activityData = {

    id:
      editingActivityId ||
      "activity_" +
      Date.now(),

    title:title,

    date:date,

    scope:activityScope,

    members:[
      ...selectedActivityMembers
    ],

    category:
      selectedActivityCategory,

    folder:folder,

    description:
      document
        .getElementById(
          "activityDescription"
        )
        .value
        .trim(),

    link:
      document
        .getElementById(
          "activityLink"
        )
        .value
        .trim(),

    address:
      document
        .getElementById(
          "activityAddress"
        )
        .value
        .trim(),

    photo:
      activityPhotoData,

    updatedAt:
      new Date().toISOString()

  };


  const existingIndex =
    activities.findIndex(
      item =>
        item.id === editingActivityId
    );


  if(existingIndex >= 0){

    activities[existingIndex] =
      activityData;

  }else{

    activities.push(
      activityData
    );

  }


  saveActivities(
    activities
  );


  closeActivityEditor();


  renderActivities();


  if(
    typeof renderSchedule === "function"
  ){

    renderSchedule();

  }


  if(
    typeof renderCalendar === "function"
  ){

    renderCalendar();

  }


  if(
    typeof renderStats === "function"
  ){

    renderStats();

  }


  showToast(
    existingIndex >= 0
      ? "activity updated ♡"
      : "activity added ♡"
  );

}



/* =========================================================
   DELETE ACTIVITY
========================================================= */

function deleteActivity(activityId){

  const activities =
    getActivities();


  const activity =
    activities.find(
      item => item.id === activityId
    );


  if(!activity){

    return;

  }


  const confirmed =
    confirm(
      `delete "${activity.title}"?`
    );


  if(!confirmed){

    return;

  }


  const updated =
    activities.filter(
      item => item.id !== activityId
    );


  saveActivities(
    updated
  );


  renderActivities();


  if(
    typeof renderSchedule === "function"
  ){

    renderSchedule();

  }


  if(
    typeof renderCalendar === "function"
  ){

    renderCalendar();

  }


  if(
    typeof renderStats === "function"
  ){

    renderStats();

  }


  showToast(
    "activity deleted"
  );

}



/* =========================================================
   FOLDERS
========================================================= */

function openFolderModal(){

  document
    .getElementById("folderName")
    .value = "";


  document
    .getElementById("folderModal")
    .classList.add("active");


  document.body.style.overflow =
    "hidden";

}


function closeFolderModal(){

  document
    .getElementById("folderModal")
    .classList.remove("active");


  document.body.style.overflow =
    "";

}


function createFolder(){

  const input =
    document.getElementById(
      "folderName"
    );


  const name =
    input.value.trim();


  if(!name){

    showToast(
      "please enter a folder name"
    );

    return;

  }


  const folders =
    getFolders();


  const exists =
    folders.some(
      folder =>
        folder.name.toLowerCase() ===
        name.toLowerCase()
    );


  if(exists){

    showToast(
      "this folder already exists"
    );

    return;

  }


  folders.push({

    id:
      "folder_" +
      Date.now(),

    name:name

  });


  saveFolders(
    folders
  );


  closeFolderModal();


  renderActivities();


  showToast(
    "folder created ♡"
  );

}


function deleteFolder(folderId){

  const folders =
    getFolders();


  const folder =
    folders.find(
      item => item.id === folderId
    );


  if(!folder){

    return;

  }


  const confirmed =
    confirm(
      `delete folder "${folder.name}"?`
    );


  if(!confirmed){

    return;

  }


  const updatedFolders =
    folders.filter(
      item => item.id !== folderId
    );


  saveFolders(
    updatedFolders
  );


  const activities =
    getActivities();


  activities.forEach(activity => {

    if(activity.folder === folderId){

      activity.folder = "";

    }

  });


  saveActivities(
    activities
  );


  renderActivities();


  showToast(
    "folder deleted"
  );

}



/* =========================================================
   ACTIVITY FILTER STATE
========================================================= */

let activityMemberFilter = "all";

let activityCategoryFilter = "all";

let activityFolderFilter = "all";



/* =========================================================
   SET FILTER
========================================================= */

function setActivityMemberFilter(memberId){

  activityMemberFilter =
    memberId;

  renderActivities();

}


function setActivityCategoryFilter(category){

  activityCategoryFilter =
    category;

  renderActivities();

}


function setActivityFolderFilter(folderId){

  activityFolderFilter =
    folderId;

  renderActivities();

}



/* =========================================================
   FILTERED ACTIVITIES
========================================================= */

function getFilteredActivities(){

  let activities =
    getActivities();


  if(
    activityMemberFilter !== "all"
  ){

    activities =
      activities.filter(
        activity =>
          Array.isArray(activity.members) &&
          activity.members.includes(
            activityMemberFilter
          )
      );

  }


  if(
    activityCategoryFilter !== "all"
  ){

    activities =
      activities.filter(
        activity =>
          activity.category ===
          activityCategoryFilter
      );

  }


  if(
    activityFolderFilter !== "all"
  ){

    activities =
      activities.filter(
        activity =>
          activity.folder ===
          activityFolderFilter
      );

  }


  return activities.sort(
    (a,b) =>
      new Date(b.date) -
      new Date(a.date)
  );

}



/* =========================================================
   RENDER ACTIVITIES
========================================================= */

function renderActivities(){

  const page =
    document.getElementById(
      "activitiesPage"
    );


  if(!page){

    return;

  }


  const activities =
    getFilteredActivities();


  const members =
    getMembers();


  const folders =
    getFolders();


  page.innerHTML = `

    <div class="page-heading">

      <h1>
        Activities
      </h1>

      <p>
        individual & group activities
      </p>

    </div>


    <div class="activity-toolbar">

      </button>

      <button
        class="secondary-button"
        onclick="openFolderModal()"

        + folder
      </button>

    </div>


    <div class="activities-card">

        members
      </div>

      <div class="filter-row">

        <button
          class="filter-chip ${activityMemberFilter === "all" ? "active" : ""}"
          onclick="setActivityMemberFilter('all')"
        >
          all
        </button>

        ${members.map(member => `

          <button
            class="filter-chip ${activityMemberFilter === member.id ? "active" : ""}"
            onclick="setActivityMemberFilter('${member.id}')"
          >
            ${escapeHTML(member.name.toLowerCase())}
          </button>

        `).join("")}

      </div>


      <div class="activity-section-title">
        category
      </div>

      <div class="filter-row">

        <button
          class="filter-chip ${activityCategoryFilter === "all" ? "active" : ""}"
          onclick="setActivityCategoryFilter('all')"
        >
          all
        </button>

        ${defaultActivityCategories.map(category => `

          <button
            class="filter-chip ${activityCategoryFilter === category ? "active" : ""}"
            onclick="setActivityCategoryFilter('${escapeHTML(category)}')"
          >
            ${escapeHTML(category)}
          </button>

        `).join("")}

      </div>


      <div class="activity-section-title">
        folders
      </div>

      <div class="filter-row">

        <button
          class="filter-chip ${activityFolderFilter === "all" ? "active" : ""}"
          onclick="setActivityFolderFilter('all')"
        >
          all
        </button>

        ${folders.map(folder => `

          <button
            class="filter-chip ${activityFolderFilter === folder.id ? "active" : ""}"
            onclick="setActivityFolderFilter('${folder.id}')"
          >
            ${escapeHTML(folder.name)}
          </button>

        `).join("")}

      </div>

    </div>


    <div class="activities-card">

      <div class="activity-section-title">
        folders
      </div>

      <div class="folder-list">

        ${
          folders.length
          ? folders.map(folder => `

              <div class="folder-chip">

                📁

                <span>
                  ${escapeHTML(folder.name)}
                </span>

                <button
                  class="folder-delete"
                  onclick="deleteFolder('${folder.id}')"
                >
                  ×
                </button>

              </div>

          `).join("")
          :
          `<span style="font-size:12px;color:#8e8e93">
             no folders yet
           </span>`
        }

      </div>

    </div>


    <div>

      ${
        activities.length
        ? activities
            .map(
              activity =>
                createActivityHTML(
                  activity,
                  members,
                  folders
                )
            )
            .join("")
        :
        `

          <div class="activities-card">

            <div class="activity-empty">

              ✨

              <br><br>

              no activities yet

              <br>

              tap “+ activity” to add one

            </div>

          </div>

        `
      }

    </div>

  `;

}



/* =========================================================
   CREATE ACTIVITY CARD
========================================================= */

function createActivityHTML(
  activity,
  members,
  folders
){

  const activityMembers =
    members.filter(
      member =>
        Array.isArray(activity.members) &&
        activity.members.includes(
          member.id
        )
    );


  const folder =
    folders.find(
      item =>
        item.id === activity.folder
    );


  const date =
    formatActivityDate(
      activity.date
    );


  const addressURL =
    activity.address
      ? "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
          activity.address
        )
      : "";


  const linkURL =
    activity.link || "";


  return `

    <div class="activity-item">

      ${
        activity.photo
        ?

        `<img
          class="activity-photo"
          src="${activity.photo}"
          alt=""
        >`

        :

        `<div
          class="activity-photo-placeholder"
        >
          ✨
        </div>`
      }


      <div class="activity-content">

        <div class="activity-topline">

          <div>

            <div class="activity-name">

              ${escapeHTML(
                activity.title
              )}

            </div>

            <div class="activity-date">

              ${date}

            </div>

          </div>

        </div>


        <span class="activity-category">

          ${escapeHTML(
            activity.category || "other"
          )}

        </span>


        ${
          folder
          ?

          `<span
            class="activity-category"
            style="margin-left:5px"
          >
            📁 ${escapeHTML(folder.name)}
          </span>`

          :
          ""
        }


        <div class="activity-members">

          ${
            activityMembers.map(member => `

              <span
                class="activity-member-tag"
                style="
                  background:${escapeHTML(member.color || "#f2f2f7")}22;
                  color:${escapeHTML(member.color || "#555")};
                "
              >
                ${escapeHTML(
                  member.name.toLowerCase()
                )}
              </span>

            `).join("")
          }

        </div>


        ${
          activity.description
          ?

          `<div class="activity-description">
            ${escapeHTML(
              activity.description
            )}
          </div>`

          :
          ""
        }


        ${
          linkURL || addressURL
          ?

          `<div class="activity-links">

            ${
              linkURL
              ?

              `<a
                class="activity-link"
                href="${escapeHTML(linkURL)}"
                target="_blank"
                rel="noopener"
              >
                🔗 link
              </a>`

              :
              ""
            }


            ${
              addressURL
              ?

              `<a
                class="activity-link"
                href="${addressURL}"
                target="_blank"
                rel="noopener"
              >
                📍 address
              </a>`

              :
              ""
            }

          </div>`

          :
          ""
        }


        <div class="activity-actions">

          <button
            class="secondary-button"
            onclick="openActivityEditor('${activity.id}')"
          >
            edit
          </button>

          <button
            class="danger-button"
            onclick="deleteActivity('${activity.id}')"
          >
            delete
          </button>

        </div>

      </div>

    </div>

  `;

}



/* =========================================================
   DATE FORMAT
========================================================= */

function formatActivityDate(dateString){

  if(!dateString){

    return "";

  }


  const parts =
    dateString.split("-");


  if(parts.length !== 3){

    return dateString;

  }


  const year =
    parts[0];

  const month =
    parts[1];

  const day =
    parts[2];


  return `${day}/${month}/${year}`;

}

<script>

/* =========================================================
   SCHEDULE DATA
========================================================= */

function getSchedules(){

  try{

    return JSON.parse(
      localStorage.getItem("illitSchedules")
    ) || [];

  }catch(error){

    return [];

  }

}


function saveSchedules(schedules){

  localStorage.setItem(
    "illitSchedules",
    JSON.stringify(schedules)
  );

}



/* =========================================================
   SCHEDULE STATE
========================================================= */

let editingScheduleId = null;

let selectedScheduleMembers = [];



/* =========================================================
   OPEN SCHEDULE EDITOR
========================================================= */

function openScheduleEditor(scheduleId = null){

  editingScheduleId =
    scheduleId;

  selectedScheduleMembers = [];


  const modal =
    document.getElementById(
      "scheduleEditorModal"
    );

  const title =
    document.getElementById(
      "scheduleModalTitle"
    );


  if(scheduleId){

    const schedules =
      getSchedules();


    const schedule =
      schedules.find(
        item =>
          item.id === scheduleId
      );


    if(!schedule){

      return;

    }


    title.textContent =
      "edit schedule";


    document.getElementById(
      "scheduleTitle"
    ).value =
      schedule.title || "";


    document.getElementById(
      "scheduleDate"
    ).value =
      schedule.date || "";


    document.getElementById(
      "scheduleTime"
    ).value =
      schedule.time || "";


    document.getElementById(
      "scheduleLocation"
    ).value =
      schedule.location || "";


    document.getElementById(
      "scheduleLink"
    ).value =
      schedule.link || "";


    document.getElementById(
      "scheduleNotes"
    ).value =
      schedule.notes || "";


    selectedScheduleMembers =
      Array.isArray(schedule.members)
        ? [...schedule.members]
        : [];

  }else{

    title.textContent =
      "add schedule";


    document.getElementById(
      "scheduleTitle"
    ).value = "";


    document.getElementById(
      "scheduleDate"
    ).value = "";


    document.getElementById(
      "scheduleTime"
    ).value = "";


    document.getElementById(
      "scheduleLocation"
    ).value = "";


    document.getElementById(
      "scheduleLink"
    ).value = "";


    document.getElementById(
      "scheduleNotes"
    ).value = "";


    selectedScheduleMembers = [];

  }


  renderScheduleMemberSelector();


  modal.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";

}



/* =========================================================
   CLOSE SCHEDULE EDITOR
========================================================= */

function closeScheduleEditor(){

  document
    .getElementById(
      "scheduleEditorModal"
    )
    .classList.remove(
      "active"
    );


  document.body.style.overflow =
    "";


  editingScheduleId =
    null;

}



/* =========================================================
   MEMBER SELECTOR
========================================================= */

function renderScheduleMemberSelector(){

  const container =
    document.getElementById(
      "scheduleMemberSelector"
    );


  const members =
    getMembers();


  container.innerHTML = "";


  members.forEach(member => {

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "schedule-member-option";


    if(
      selectedScheduleMembers.includes(
        member.id
      )
    ){

      button.classList.add(
        "selected"
      );

    }


    button.innerHTML = `

      <span
        class="schedule-member-option-name"
        style="color:${escapeHTML(member.color || "#111")}"
      >
        ${escapeHTML(member.name)}
      </span>

      <span class="schedule-member-option-korean">
        ${escapeHTML(member.korean || "")}
      </span>

    `;


    button.onclick =
      function(){

        toggleScheduleMember(
          member.id
        );

      };


    container.appendChild(
      button
    );

  });

}


function toggleScheduleMember(memberId){

  if(
    selectedScheduleMembers.includes(
      memberId
    )
  ){

    selectedScheduleMembers =
      selectedScheduleMembers.filter(
        id =>
          id !== memberId
      );

  }else{

    selectedScheduleMembers.push(
      memberId
    );

  }


  renderScheduleMemberSelector();

}



/* =========================================================
   SAVE SCHEDULE
========================================================= */

function saveSchedule(){

  const title =
    document
      .getElementById(
        "scheduleTitle"
      )
      .value
      .trim();


  const date =
    document
      .getElementById(
        "scheduleDate"
      )
      .value;


  if(!title){

    showToast(
      "please add a schedule title"
    );

    return;

  }


  if(!date){

    showToast(
      "please select a date"
    );

    return;

  }


  const schedules =
    getSchedules();


  const scheduleData = {

    id:
      editingScheduleId ||
      "schedule_" +
      Date.now(),

    title:title,

    date:date,

    time:
      document
        .getElementById(
          "scheduleTime"
        )
        .value,

    members:[
      ...selectedScheduleMembers
    ],

    location:
      document
        .getElementById(
          "scheduleLocation"
        )
        .value
        .trim(),

    link:
      document
        .getElementById(
          "scheduleLink"
        )
        .value
        .trim(),

    notes:
      document
        .getElementById(
          "scheduleNotes"
        )
        .value
        .trim(),

    updatedAt:
      new Date().toISOString()

  };


  const existingIndex =
    schedules.findIndex(
      item =>
        item.id ===
        editingScheduleId
    );


  if(existingIndex >= 0){

    schedules[existingIndex] =
      scheduleData;

  }else{

    schedules.push(
      scheduleData
    );

  }


  saveSchedules(
    schedules
  );


  closeScheduleEditor();


  renderSchedule();


  if(
    typeof renderCalendar ===
    "function"
  ){

    renderCalendar();

  }


  showToast(
    existingIndex >= 0
      ? "schedule updated ♡"
      : "schedule added ♡"
  );

}



/* =========================================================
   DELETE SCHEDULE
========================================================= */

function deleteSchedule(scheduleId){

  const schedules =
    getSchedules();


  const schedule =
    schedules.find(
      item =>
        item.id ===
        scheduleId
    );


  if(!schedule){

    return;

  }


  if(
    !confirm(
      `delete "${schedule.title}"?`
    )
  ){

    return;

  }


  saveSchedules(
    schedules.filter(
      item =>
        item.id !==
        scheduleId
    )
  );


  renderSchedule();


  if(
    typeof renderCalendar ===
    "function"
  ){

    renderCalendar();

  }


  showToast(
    "schedule deleted"
  );

}



/* =========================================================
   SCHEDULE DATE HELPERS
========================================================= */

function isSchedulePast(schedule){

  const now =
    new Date();


  const scheduleDate =
    new Date(
      schedule.date +
      "T" +
      (
        schedule.time ||
        "23:59"
      )
    );


  return scheduleDate < now;

}


function formatScheduleDate(dateString){

  if(!dateString){

    return "";

  }


  const parts =
    dateString.split("-");


  if(parts.length !== 3){

    return dateString;

  }


  const months = [

    "jan",
    "feb",
    "mar",
    "apr",
    "may",
    "jun",
    "jul",
    "aug",
    "sep",
    "oct",
    "nov",
    "dec"

  ];


  return {

    day:parts[2],

    month:
      months[
        Number(parts[1]) - 1
      ]

  };

}



/* =========================================================
   RENDER SCHEDULE
========================================================= */

function renderSchedule(){

  const page =
    document.getElementById(
      "schedulePage"
    );


  if(!page){

    return;

  }


  const schedules =
    getSchedules()
      .sort(
        (a,b) => {

          const aDate =
            new Date(
              a.date +
              "T" +
              (
                a.time ||
                "23:59"
              )
            );

          const bDate =
            new Date(
              b.date +
              "T" +
              (
                b.time ||
                "23:59"
              )
            );

          return aDate - bDate;

        }
      );


  const members =
    getMembers();


  const upcoming =
    schedules.filter(
      schedule =>
        !isSchedulePast(
          schedule
        )
    );


  const past =
    schedules.filter(
      schedule =>
        isSchedulePast(
          schedule
        )
    );


  page.innerHTML = `

    <div class="page-heading">

      <h1>
        Schedule
      </h1>

      <p>
        illit activities & plans
      </p>

    </div>


    <div class="activity-toolbar">

      <button
        class="primary-button"
        onclick="openScheduleEditor()"
      >
        + schedule
      </button>

      <button
        class="secondary-button"
        onclick="showPage('calendar')"
      >
        calendar
      </button>

    </div>


    <div class="schedule-card">

      <div class="schedule-section-title">
        upcoming
      </div>

      <div class="schedule-section-subtitle">
        upcoming activities
      </div>


      ${
        upcoming.length
        ?

        upcoming
          .map(
            schedule =>
              createScheduleHTML(
                schedule,
                members
              )
          )
          .join("")

        :

        `

          <div class="schedule-empty">

            no upcoming schedules yet ♡

          </div>

        `
      }

    </div>


    <div class="schedule-card">

      <div class="schedule-section-title">
        past
      </div>

      <div class="schedule-section-subtitle">
        completed schedules
      </div>


      ${
        past.length
        ?

        past
          .slice()
          .reverse()
          .map(
            schedule =>
              createScheduleHTML(
                schedule,
                members
              )
          )
          .join("")

        :

        `

          <div class="schedule-empty">

            no past schedules yet

          </div>

        `
      }

    </div>

  `;

}



/* =========================================================
   CREATE SCHEDULE CARD
========================================================= */

function createScheduleHTML(
  schedule,
  members
){

  const date =
    formatScheduleDate(
      schedule.date
    );


  const scheduleMembers =
    members.filter(
      member =>
        Array.isArray(
          schedule.members
        ) &&
        schedule.members.includes(
          member.id
        )
    );


  const locationURL =
    schedule.location
      ? "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
          schedule.location
        )
      : "";


  return `

    <div class="schedule-item">

      <div class="schedule-date-box">

        <div class="schedule-date-day">

          ${escapeHTML(
            date.day

/* =========================================================
   CALENDAR STATE
========================================================= */

let calendarDate =
  new Date();

let selectedCalendarDate =
  null;



/* =========================================================
   CHANGE MONTH
========================================================= */

function changeCalendarMonth(amount){

  calendarDate.setMonth(
    calendarDate.getMonth() +
    amount
  );

  renderCalendar();

}



/* =========================================================
   SELECT CALENDAR DATE
========================================================= */

function selectCalendarDate(dateString){

  selectedCalendarDate =
    dateString;

  renderCalendar();

}



/* =========================================================
   CALENDAR HELPERS
========================================================= */

function padNumber(number){

  return String(
    number
  ).padStart(
    2,
    "0"
  );

}


function getDateString(
  year,
  month,
  day
){

  return (
    year +
    "-" +
    padNumber(month + 1) +
    "-" +
    padNumber(day)
  );

}


function getMonthName(month){

  const months = [

    "january",
    "february",
    "march",
    "april",
    "may",
    "june",
    "july",
    "august",
    "september",
    "october",
    "november",
    "december"

  ];

  return months[month];

}



/* =========================================================
   RENDER CALENDAR
========================================================= */

function renderCalendar(){

  const page =
    document.getElementById(
      "calendarPage"
    );


  if(!page){

    return;

  }


  const year =
    calendarDate.getFullYear();


  const month =
    calendarDate.getMonth();


  const activities =
    getActivities();


  const schedules =
    getSchedules();


  const allCalendarItems = [

    ...activities.map(
      activity => ({
        ...activity,
        calendarType:"activity"
      })
    ),

    ...schedules.map(
      schedule => ({
        ...schedule,
        calendarType:"schedule"
      })
    )

  ];


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const today =
    new Date();


  const todayString =
    getDateString(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


  if(
    !selectedCalendarDate ||
    !selectedCalendarDate.startsWith(
      year + "-" +
      padNumber(month + 1)
    )
  ){

    selectedCalendarDate =
      today.getFullYear() === year &&
      today.getMonth() === month

        ?

        todayString

        :

        getDateString(
          year,
          month,
          1
        );

  }


  let calendarDays = "";


  for(
    let i = 0;
    i < firstDay;
    i++
  ){

    calendarDays += `

      <div class="calendar-day empty"></div>

    `;

  }


  for(
    let day = 1;
    day <= daysInMonth;
    day++
  ){

    const dateString =
      getDateString(
        year,
        month,
        day
      );


    const hasItem =
      allCalendarItems.some(
        item =>
          item.date ===
          dateString
      );


    const isToday =
      dateString ===
      todayString;


    const isSelected =
      dateString ===
      selectedCalendarDate;


    calendarDays += `

      <button
        class="
          calendar-day
          ${hasItem ? "has-activity" : ""}
          ${isToday ? "today" : ""}
          ${isSelected ? "selected" : ""}
        "
        onclick="selectCalendarDate('${dateString}')"
      >

        ${day}

      </button>

    `;

  }


  const selectedItems =
    allCalendarItems.filter(
      item =>
        item.date ===
        selectedCalendarDate
    );


  const members =
    getMembers();


  const selectedDateParts =
    selectedCalendarDate
      ? selectedCalendarDate.split("-")
      : null;


  let selectedDateTitle =
    selectedCalendarDate;


  if(selectedDateParts){

    selectedDateTitle =
      `${selectedDateParts[2]}/${selectedDateParts[1]}/${selectedDateParts[0]}`;

  }


  page.innerHTML = `

    <div class="page-heading">

      <h1>
        Calendar
      </h1>

      <p>
        illit activity calendar
      </p>

    </div>


    <div class="calendar-card">

      <div class="calendar-header">

        <button
          class="calendar-arrow"
          onclick="changeCalendarMonth(-1)"
        >
          ‹
        </button>


        <div class="calendar-month-title">

          ${getMonthName(month)}
          ${year}

        </div>


        <button
          class="calendar-arrow"
          onclick="changeCalendarMonth(1)"
        >
          ›
        </button>

      </div>


      <div class="calendar-weekdays">

        <div class="calendar-weekday">sun</div>
        <div class="calendar-weekday">mon</div>
        <div class="calendar-weekday">tue</div>
        <div class="calendar-weekday">wed</div>
        <div class="calendar-weekday">thu</div>
        <div class="calendar-weekday">fri</div>
        <div class="calendar-weekday">sat</div>

      </div>


      <div class="calendar-grid">

        ${calendarDays}

      </div>

    </div>


    <div class="calendar-card">

      <div class="calendar-selected-title">

        ${selectedDateTitle}

      </div>


      ${
        selectedItems.length

        ?

        selectedItems
          .map(
            item =>
              createCalendarItemHTML(
                item,
                members
              )
          )
          .join("")

        :

        `

          <div class="activity-empty">

            no activities on this date ♡

          </div>

        `
      }

    </div>

  `;

}



/* =========================================================
   CALENDAR ITEM
========================================================= */

function createCalendarItemHTML(
  item,
  members
){

  const itemMembers =
    members.filter(
      member =>
        Array.isArray(
          item.members
        ) &&
        item.members.includes(
          member.id
        )
    );


  const isSchedule =
    item.calendarType ===
    "schedule";


  return `

    <div
      class="calendar-day-activity"
      onclick="${
        isSchedule
          ? `openScheduleEditor('${item.id}')`
          : `openActivityEditor('${item.id}')`
      }"
      style="cursor:pointer"
    >

      <div class="calendar-day-activity-title">

        ${
          isSchedule
            ? "📅 "
            : "✨ "
        }

        ${escapeHTML(
          item.title
        )}

      </div>


      ${
        isSchedule &&
        item.time

        ?

        `<div class="calendar-day-activity-info">

          🕐 ${escapeHTML(
            item.time
          )}

        </div>`

        :

        ""
      }


      ${
        item.category

        ?

        `<div class="calendar-day-activity-info">

          ${escapeHTML(
            item.category
          )}

        </div>`

        :

        ""
      }


      <div class="calendar-day-activity-members">

        ${
          itemMembers
            .map(member => `

              <span
                class="calendar-mini-member"
                style="
                  background:${escapeHTML(member.color || "#f2f2f7")}22;
                  color:${escapeHTML(member.color || "#555")};
                "
              >
                ${escapeHTML(
                  member.name.toLowerCase()
                )}
              </span>

            `)
            .join("")
        }

      </div>

    </div>

  `;

}



/* =========================================================
   MODAL OUTSIDE CLICK
========================================================= */

document.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById(
        "scheduleEditorModal"

    if(
      event.target === modal

      closeScheduleEditor();

    }

  }

========================================================= */

if(
  typeof renderSchedule ===
  "function"
){

  renderSchedule();

}


if(
  typeof renderCalendar ===
  "function"
){

  renderCalendar();

}

</script>
